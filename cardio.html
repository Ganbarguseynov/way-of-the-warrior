<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дистанция</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.tabs { display: flex; gap: 8px; margin: 10px 0; }
.tab { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; font-weight: 700; cursor: pointer; }
.tab.on { background: #5ac8fa; color: #000; border-color: #5ac8fa; }
.card { background: #1c1c1e; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2c2c2e; }
#map { height: 260px; border-radius: 12px; margin-bottom: 10px; background: #0f0f10; }
.big { font-size: 34px; font-weight: bold; text-align: center; }
.muted { color: #8e8e93; font-size: 13px; }
.chart-box { background: #2c2c2e; border-radius: 12px; padding: 10px; height: 240px; position: relative; margin-bottom: 10px; }
.hist-item { background: #1c1c1e; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2c2c2e; font-size: 14px; }
</style>
</head>
<body>
<div class="inner-screen">
<button class="back-btn" onclick="window.location.href='index.html'">← Назад в приложение</button>
<h1>Дистанция</h1>
<p id="mode-note" class="muted"></p>
<p id="status" style="color: #ff9500; font-size: 13px;"></p>

<div class="tabs">
<button id="tab-rec" class="tab on" onclick="showTab('rec')">Запись</button>
<button id="tab-hist" class="tab" onclick="showTab('hist')">История</button>
</div>

<div id="rec-box">
<div id="setup" class="card">
<div class="form-group"><label>Вид</label>
<select id="sport">
<option value="run">🏃 Бег</option>
<option value="walk">🚶 Ходьба</option>
<option value="bike">🚴 Велоспорт</option>
<option value="ski">⛷ Лыжи</option>
</select></div>
<div class="form-group"><label>Цель, км (необязательно)</label><input type="number" id="goal-km" step="0.1" min="0"></div>
<div class="form-group"><label>Лимит времени, мин (необязательно)</label><input type="number" id="goal-min" step="1" min="0"></div>
<button class="btn" onclick="startSession()">Старт</button>
</div>

<div id="live" class="card" style="display: none; text-align: center;">
<div id="live-km" class="big">0.00 км</div>
<div id="live-time" class="muted">00:00:00</div>
<div id="live-speed" style="color: #5ac8fa; font-size: 14px; margin-top: 6px;">—</div>
<div id="live-goal" class="muted" style="margin-top: 6px;"></div>
<div id="diag" class="muted" style="margin-top: 8px;"></div>
<button class="btn" style="background: #ff3b30; color: #fff; margin-top: 12px;" onclick="stopSession()">Стоп</button>
</div>

<div id="map-box" style="display: none;"><div id="map"></div></div>

<div id="result" class="card" style="display: none; font-size: 14px; line-height: 1.6;"></div>
</div>

<div id="hist-box" style="display: none;">
<div class="card">
<div class="form-group"><label>Вид</label>
<select id="h-sport" onchange="renderHistory()">
<option value="run">🏃 Бег</option>
<option value="walk">🚶 Ходьба</option>
<option value="bike">🚴 Велоспорт</option>
<option value="ski">⛷ Лыжи</option>
</select></div>
<div class="form-group"><label>Показатель</label>
<select id="h-metric" onchange="renderHistory()">
<option value="dist">Дистанция, км</option>
<option value="pace">Темп или скорость</option>
<option value="time">Время, мин</option>
<option value="kcal">Калории</option>
</select></div>
</div>
<div class="chart-box"><canvas id="h-chart"></canvas></div>
<p id="hist-status" style="color: #ff9500; font-size: 13px;"></p>
<div id="h-list"></div>
</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const sb = supabase.createClient('https://qnpriwfxzuoymoumdtrl.supabase.co', 'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF');

const SPORTS = {
  run:  { name: 'Бег',       met: 9.8, maxMs: 9,    pace: true },
  walk: { name: 'Ходьба',    met: 3.5, maxMs: 3.5,  pace: true },
  bike: { name: 'Велоспорт', met: 8.0, maxMs: 25,   pace: false },
  ski:  { name: 'Лыжи',      met: 7.0, maxMs: 15,   pace: true }
};
const MAX_ACC = 50;
const SPEED_TOL = 1.3;
const MIN_STEP = 3;
const MAX_ROUTE = 600;
const NATIVE = !!(window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.BackgroundGeolocation);
const BG = NATIVE ? Capacitor.Plugins.BackgroundGeolocation : null;

const $ = id => document.getElementById(id);
let session = null, map = null, routeLine = null, marker = null, chart = null, historyRows = [];

function playerKey(){
  const tgId = localStorage.getItem('tgId');
  if (tgId) return 'tg:' + tgId;
  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (email) return 'email:' + email.toLowerCase();
  let anon = localStorage.getItem('arenaAnonId');
  if (!anon) {
    anon = 'anon:' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('arenaAnonId', anon);
  }
  return anon;
}

function weight(){
  try {
    const w = parseFloat(JSON.parse(localStorage.getItem('cachedProfile') || '{}').weight);
    return w > 0 ? w : 70;
  } catch (e) { return 70; }
}

function haversine(a, b){
  const R = 6371000, toRad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toRad, dLon = (b.lon - a.lon) * toRad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function fmtTime(sec){
  const s = Math.floor(sec);
  return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(v => String(v).padStart(2, '0')).join(':');
}

function paceValue(sport, distM, durS){
  const km = distM / 1000;
  if (!(km > 0) || !(durS > 0)) return null;
  return sport.pace ? (durS / 60) / km : km / (durS / 3600);
}

function paceText(sport, distM, durS){
  const v = paceValue(sport, distM, durS);
  if (v === null) return '—';
  if (sport.pace) {
    let m = Math.floor(v), s = Math.round((v - m) * 60);
    if (s === 60) { m++; s = 0; }
    return m + ':' + String(s).padStart(2, '0') + ' мин/км';
  }
  return v.toFixed(1) + ' км/ч';
}

function showTab(name){
  $('tab-rec').classList.toggle('on', name === 'rec');
  $('tab-hist').classList.toggle('on', name === 'hist');
  $('rec-box').style.display = name === 'rec' ? 'block' : 'none';
  $('hist-box').style.display = name === 'hist' ? 'block' : 'none';
  if (name === 'hist') loadHistory();
}

function ensureMap(){
  if (map) return;
  map = L.map('map').setView([55.75, 37.62], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
  routeLine = L.polyline([], { color: '#5ac8fa', weight: 4 }).addTo(map);
}

function showMap(){
  $('map-box').style.display = 'block';
  ensureMap();
  map.invalidateSize();
}

function resetMap(){
  if (!map) return;
  routeLine.setLatLngs([]);
  if (marker) { marker.remove(); marker = null; }
}

function drawLive(){
  const s = session;
  if (!s || !map) return;
  const ll = s.points.map(p => [p.lat, p.lon]);
  routeLine.setLatLngs(ll);
  const last = ll[ll.length - 1];
  if (!marker) {
    marker = L.circleMarker(last, { radius: 8, color: '#fff', weight: 2, fillColor: '#5ac8fa', fillOpacity: 1 }).addTo(map);
    map.setView(last, 17);
  } else {
    marker.setLatLng(last);
    map.panTo(last);
  }
}

function addPoint(s, p){
  s.last = p;
  s.points.push(p);
  drawLive();
}

function accept(p){
  const s = session;
  if (!s) return;
  s.raw++;
  if (p.time < s.startedAt - 2000) return;
  if (p.mock) { s.flagged++; return; }
  if (!(p.acc <= MAX_ACC)) { s.weak++; return; }
  if (!s.last) { addPoint(s, p); return; }
  const dt = (p.time - s.last.time) / 1000;
  if (!(dt > 0)) return;
  const d = haversine(s.last, p);
  if (d < MIN_STEP) return;
  if (d / dt > SPORTS[s.sport].maxMs * SPEED_TOL || (d > 150 && dt < 10)) {
    s.jumps++;
    s.rejectRun++;
    if (s.rejectRun >= 5) { s.last = null; s.rejectRun = 0; }
    return;
  }
  s.rejectRun = 0;
  s.distanceM += d;
  addPoint(s, p);
}

function startWatch(onPoint, onError){
  if (NATIVE) {
    return BG.addWatcher({
      backgroundMessage: 'Запись тренировки идёт',
      backgroundTitle: 'Дистанция',
      requestPermissions: true,
      stale: false,
      distanceFilter: 3
    }, (loc, err) => {
      if (err) { onError(err.message || 'Ошибка GPS'); return; }
      if (!loc) return;
      onPoint({
        lat: loc.latitude, lon: loc.longitude, acc: loc.accuracy, time: loc.time,
        mock: !!(loc.isFromMockProvider || loc.simulated)
      });
    });
  }
  return navigator.geolocation.watchPosition(
    pos => onPoint({
      lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy,
      time: pos.timestamp, mock: false
    }),
    err => onError(err.code === 1 ? 'Нет доступа к геолокации. Разрешите её для этого приложения.' : (err.message || 'Ошибка GPS')),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
  );
}

async function stopWatch(id){
  if (id === null || id === undefined) return;
  if (NATIVE) await BG.removeWatcher({ id: id });
  else navigator.geolocation.clearWatch(id);
}

async function startSession(){
  if (session) return;
  const goalKm = parseFloat($('goal-km').value);
  const goalMin = parseFloat($('goal-min').value);
  session = {
    sport: $('sport').value,
    key: playerKey(),
    startedAt: Date.now(),
    goalM: goalKm > 0 ? goalKm * 1000 : 0,
    limitS: goalMin > 0 ? goalMin * 60 : 0,
    goalDone: false,
    points: [], last: null, distanceM: 0,
    flagged: 0, weak: 0, jumps: 0, raw: 0, rejectRun: 0,
    watcher: null, timer: null
  };
  $('status').textContent = '';
  $('result').style.display = 'none';
  showMap();
  resetMap();
  try {
    session.watcher = await startWatch(accept, msg => { $('status').textContent = msg; });
  } catch (e) {
    session = null;
    $('map-box').style.display = 'none';
    $('status').textContent = 'Не удалось включить GPS: ' + (e.message || e);
    return;
  }
  $('setup').style.display = 'none';
  $('live').style.display = 'block';
  session.timer = setInterval(tick, 1000);
  tick();
}

function tick(){
  const s = session;
  if (!s) return;
  const el = (Date.now() - s.startedAt) / 1000;
  $('live-km').textContent = (s.distanceM / 1000).toFixed(2) + ' км';
  $('live-time').textContent = fmtTime(el);
  $('live-speed').textContent = paceText(SPORTS[s.sport], s.distanceM, el);
  const g = [];
  if (s.goalM) g.push('Цель: ' + (s.goalM / 1000) + ' км' + (s.goalDone ? ' (выполнена)' : ''));
  if (s.limitS) g.push('лимит ' + Math.round(s.limitS / 60) + ' мин');
  $('live-goal').textContent = g.join(' · ');
  let diag = 'GPS: получено ' + s.raw + ', принято ' + s.points.length + ', слабый сигнал ' + s.weak + ', отброшено ' + s.jumps;
  if (s.raw === 0 && el > 30) diag += '. Точек пока нет: проверьте доступ к геолокации и выйдите на открытое место';
  $('diag').textContent = diag;
  if (s.goalM && !s.goalDone && s.distanceM >= s.goalM) s.goalDone = true;
  if (s.limitS && el >= s.limitS) stopSession();
}

function downsample(points){
  const step = Math.max(1, Math.ceil(points.length / MAX_ROUTE));
  const out = [];
  for (let i = 0; i < points.length; i += step) out.push([points[i].lat, points[i].lon, points[i].time]);
  const last = points[points.length - 1];
  if (last && out[out.length - 1][2] !== last.time) out.push([last.lat, last.lon, last.time]);
  return out;
}

function showResult(rec){
  const sport = SPORTS[rec.activity];
  const goalLine = rec.goal_m
    ? (rec.goal_reached ? 'Цель выполнена' : 'Цель не выполнена: ' + (rec.distance_m / 1000).toFixed(2) + ' из ' + (rec.goal_m / 1000) + ' км')
    : '';
  $('result').style.display = 'block';
  $('result').innerHTML =
    '<b>' + sport.name + '</b><br>' +
    'Дистанция: ' + (rec.distance_m / 1000).toFixed(2) + ' км<br>' +
    'Время: ' + fmtTime(rec.duration_s) + '<br>' +
    'Темп / скорость: ' + paceText(sport, rec.distance_m, rec.duration_s) + '<br>' +
    'Калории: около ' + rec.kcal + '<br>' +
    (goalLine ? goalLine + '<br>' : '') +
    (rec.flagged ? '<span class="muted">Не засчитано точек с подменой GPS: ' + rec.flagged + '</span><br>' : '');
}

async function stopSession(){
  const s = session;
  if (!s) return;
  session = null;
  clearInterval(s.timer);
  const durS = (Date.now() - s.startedAt) / 1000;
  try { await stopWatch(s.watcher); } catch (e) {}
  $('live').style.display = 'none';
  $('setup').style.display = 'block';

  if (s.points.length < 2 || s.distanceM <= 0) {
    $('map-box').style.display = 'none';
    $('status').textContent = 'Недостаточно точек GPS, запись не сохранена.';
    return;
  }
  if (map && routeLine.getLatLngs().length > 1) map.fitBounds(routeLine.getBounds(), { padding: [20, 20] });

  const rec = {
    player_key: s.key,
    activity: s.sport,
    distance_m: Math.round(s.distanceM),
    duration_s: Math.round(durS),
    kcal: Math.round(SPORTS[s.sport].met * weight() * durS / 3600),
    flagged: s.flagged,
    goal_m: s.goalM ? Math.round(s.goalM) : null,
    goal_s: s.limitS ? Math.round(s.limitS) : null,
    goal_reached: !!(s.goalM && s.distanceM >= s.goalM),
    route: downsample(s.points),
    recorded_at: new Date(s.startedAt).toISOString()
  };
  showResult(rec);
  queueRecord(rec);
}

function queueRecord(rec){
  let log = [];
  try { log = JSON.parse(localStorage.getItem('cardioLog') || '[]'); } catch (e) {}
  log.push(Object.assign({ sent: false }, rec));
  localStorage.setItem('cardioLog', JSON.stringify(log));
  flushLog();
}

async function flushLog(){
  let log = [];
  try { log = JSON.parse(localStorage.getItem('cardioLog') || '[]'); } catch (e) { return; }
  const todo = log.filter(x => !x.sent);
  if (!todo.length) return;
  const rows = todo.map(x => {
    const row = Object.assign({}, x);
    delete row.sent;
    return row;
  });
  const { error } = await sb.from('cardio_sessions').insert(rows);
  if (error) {
    $('status').textContent = 'Не отправлено, повторю позже: ' + error.message;
    return;
  }
  todo.forEach(x => { x.sent = true; });
  localStorage.setItem('cardioLog', JSON.stringify(log));
  $('status').textContent = '';
  loadHistory();
}

async function loadHistory(){
  const { data, error } = await sb.from('cardio_sessions')
    .select('*').eq('player_key', playerKey()).order('recorded_at', { ascending: true });
  if (error) { $('hist-status').textContent = 'Не удалось загрузить историю: ' + error.message; return; }
  historyRows = data || [];
  $('hist-status').textContent = '';
  renderHistory();
}

function metricValue(row, metric){
  if (metric === 'dist') return row.distance_m / 1000;
  if (metric === 'time') return row.duration_s / 60;
  if (metric === 'kcal') return row.kcal;
  return paceValue(SPORTS[row.activity], row.distance_m, row.duration_s);
}

function renderHistory(){
  const sportKey = $('h-sport').value;
  const metric = $('h-metric').value;
  const sport = SPORTS[sportKey];
  const rows = historyRows.filter(r => r.activity === sportKey);

  const titles = {
    dist: 'Дистанция, км',
    time: 'Время, мин',
    kcal: 'Калории, ккал',
    pace: sport.pace ? 'Темп, мин/км (меньше = быстрее)' : 'Скорость, км/ч (больше = быстрее)'
  };
  const labels = rows.map(r => r.recorded_at.slice(0, 10).split('-').reverse().join('.'));
  const values = rows.map(r => {
    const v = metricValue(r, metric);
    return v === null ? null : Math.round(v * 100) / 100;
  });

  if (chart) chart.destroy();
  chart = new Chart($('h-chart').getContext('2d'), {
    type: 'line',
    data: { labels: labels, datasets: [{
      label: titles[metric], data: values, borderColor: '#5ac8fa', backgroundColor: '#5ac8fa33',
      borderWidth: 2, pointRadius: 3, fill: true, tension: 0.3
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, title: { display: true, text: titles[metric], color: '#fff' } },
      scales: {
        x: { ticks: { color: '#8e8e93' }, grid: { color: 'rgba(255,255,255,0.1)' } },
        y: { ticks: { color: '#8e8e93' }, grid: { color: 'rgba(255,255,255,0.1)' } }
      }
    }
  });

  $('h-list').innerHTML = rows.length
    ? rows.slice().reverse().map(r =>
        '<div class="hist-item"><b>' + labels[rows.indexOf(r)] + '</b><br>' +
        (r.distance_m / 1000).toFixed(2) + ' км · ' + fmtTime(r.duration_s) + ' · ' +
        paceText(sport, r.distance_m, r.duration_s) + ' · ' + r.kcal + ' ккал</div>'
      ).join('')
    : '<p class="muted">Записей по этому виду пока нет.</p>';
}

function init(){
  $('mode-note').textContent = NATIVE
    ? 'Фоновая запись включена: можно выключить экран, запись продолжится.'
    : 'В браузере или Telegram запись останавливается, когда приложение свёрнуто или экран выключен.';
  flushLog();
  loadHistory();
}

init();
</script>
</body>
</html>
