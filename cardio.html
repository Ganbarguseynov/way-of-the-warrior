<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Челлендж дня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.card { background: #1c1c1e; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2c2c2e; }
.muted { color: #8e8e93; font-size: 13px; }
.done { color: #34c759; font-weight: bold; }
.item { background: #1c1c1e; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2c2c2e; font-size: 14px; }
</style>
</head>
<body>
<div class="inner-screen">
<button class="back-btn" onclick="window.location.href='index.html'">← Назад в приложение</button>
<h1>Челлендж дня</h1>
<p id="status" class="muted"></p>

<div class="card">
<div id="ch-title" style="font-size: 20px; font-weight: bold; margin-bottom: 6px;">—</div>
<div id="ch-desc" class="muted" style="font-size: 14px; margin-bottom: 10px;"></div>
<div id="ch-xp" style="color: #ffcc00; font-size: 14px; margin-bottom: 12px;"></div>
<button id="ch-btn" class="btn" onclick="complete()" disabled>Выполнено</button>
</div>

<h3>Последние выполненные</h3>
<div id="ch-history"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const sb = supabase.createClient('https://qnpriwfxzuoymoumdtrl.supabase.co', 'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF');

const CHALLENGES = [
  { title: '30 приседаний', desc: 'Сделайте 30 приседаний подряд', xp: 15 },
  { title: 'Выпить 2 литра воды', desc: 'За день выпейте 2000 мл воды', xp: 15 },
  { title: '20 отжиманий', desc: 'Сделайте 20 отжиманий, можно с отдыхом', xp: 15 },
  { title: 'Прогулка 3000 шагов', desc: 'Пройдите 3000 шагов за день', xp: 20 },
  { title: 'Планка 1 минута', desc: 'Удержите планку 60 секунд', xp: 15 },
  { title: '50 прыжков', desc: 'Сделайте 50 прыжков на месте', xp: 15 },
  { title: 'Растяжка 10 минут', desc: 'Потянитесь 10 минут без спешки', xp: 10 },
  { title: '10 минут зарядки', desc: 'Любые упражнения 10 минут подряд', xp: 20 }
];

let record = null;

function pad(n){ return String(n).padStart(2, '0'); }

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function todayChallenge(){
  const dayNum = Math.floor(Date.now() / 86400000);
  return CHALLENGES[dayNum % CHALLENGES.length];
}

async function findRecord(){
  const tgId = localStorage.getItem('tgId') || (tg.initDataUnsafe && tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : null);
  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (tgId) {
    const { data } = await sb.from('user_links').select('*').eq('telegram_id', tgId);
    if (data && data.length) return data[0];
  }
  if (email) {
    const { data } = await sb.from('user_links').select('*').eq('email', email);
    if (data && data.length) return data[0];
  }
  return null;
}

function doneList(){
  return record && Array.isArray(record.challenges) ? record.challenges : [];
}

function render(){
  const ch = todayChallenge();
  const today = todayStr();
  const doneToday = doneList().some(x => x.date === today);
  $('ch-title').textContent = ch.title;
  $('ch-desc').textContent = ch.desc;
  $('ch-xp').textContent = 'Награда: +' + ch.xp + ' XP';
  $('ch-btn').disabled = !record || doneToday;
  $('ch-btn').textContent = doneToday ? 'Сегодня уже выполнено' : 'Выполнено';

  const items = doneList().slice().reverse().slice(0, 20);
  $('ch-history').innerHTML = items.length
    ? items.map(x => '<div class="item"><span class="done">✓</span> ' + x.date.split('-').reverse().join('.') + ' · ' + x.title + ' · +' + x.xp + ' XP</div>').join('')
    : '<p class="muted">Пока ничего не выполнено.</p>';
}

function $(id){ return document.getElementById(id); }

async function complete(){
  const ch = todayChallenge();
  const today = todayStr();
  $('ch-btn').disabled = true;
  try {
    const fresh = await findRecord();
    if (!fresh) { tg.showAlert('Аккаунт не найден. Войдите на главной.'); return; }
    const list = Array.isArray(fresh.challenges) ? fresh.challenges.slice() : [];
    if (list.some(x => x.date === today)) { record = fresh; render(); return; }
    list.push({ date: today, title: ch.title, xp: ch.xp });
    const xp = (fresh.xp || 0) + ch.xp;
    const { error } = await sb.from('user_links').update({ challenges: list, xp: xp }).eq('id', fresh.id);
    if (error) { tg.showAlert('Не сохранилось: ' + error.message); return; }
    record = { ...fresh, challenges: list, xp: xp };
    localStorage.setItem('cachedXP', String(xp));
    render();
    tg.showAlert('+' + ch.xp + ' XP начислено');
  } catch (e) {
    tg.showAlert('Ошибка сети. Попробуйте ещё раз.');
  } finally {
    $('ch-btn').disabled = !record || doneList().some(x => x.date === today);
  }
}

async function init(){
  try { record = await findRecord(); } catch (e) { record = null; }
  if (!record) {
    $('status').textContent = 'Нет входа в аккаунт. Откройте приложение с главной и войдите.';
  }
  render();
}

init();
</script>
</body>
</html>
