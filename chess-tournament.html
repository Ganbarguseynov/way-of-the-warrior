<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Турниры — Chess Royale</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#1e1b4b,#0f172a 60%);color:#fff;padding:14px 14px 100px;user-select:none}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{width:38px;height:38px;border-radius:12px;border:2px solid #fff;background:linear-gradient(180deg,#475569,#1e293b);color:#fff;font-size:20px;font-weight:900;cursor:pointer;flex-shrink:0}
h1{font-size:22px;font-weight:900;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.reg{font-size:12.5px;color:#5ee0ff;font-weight:800;margin:0 0 12px;min-height:16px}
.path{display:flex;align-items:center;justify-content:space-between;gap:4px;background:rgba(15,23,42,.7);border:2px solid #334155;border-radius:14px;padding:10px 8px;margin-bottom:10px}
.path span{flex:1;text-align:center;font-size:10.5px;font-weight:900;color:#64748b;line-height:1.2}
.path span.on{color:#ffd447}
.path i{font-style:normal;color:#475569;font-weight:900}
.rule{font-size:11.5px;color:#94a3b8;line-height:1.5;margin-bottom:12px;font-weight:600}
.card{background:linear-gradient(145deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 #050b16}
.card.region{border-color:#22c55e}
.card.country{border-color:#5ee0ff}
.card.continent{border-color:#a78bfa}
.card.world{border-color:#ffd447}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:10px;font-weight:900;letter-spacing:.8px;color:#94a3b8;text-transform:uppercase}
.tm{font-size:12px;font-weight:900;color:#ffd447;font-variant-numeric:tabular-nums;white-space:nowrap}
.nm{font-size:17px;font-weight:900;margin:6px 0 10px}
.stat{display:flex;border-radius:11px;overflow:hidden;margin-bottom:10px;border:1px solid #334155}
.stat div{flex:1;padding:8px 4px;text-align:center;background:rgba(0,0,0,.25)}
.stat div+div{border-left:1px solid #334155}
.stat span{display:block;font-size:9px;color:#94a3b8;font-weight:800}
.stat b{display:block;font-size:16px;font-weight:900;margin-top:2px}
.btn{width:100%;padding:12px;border:0;border-radius:11px;font-size:13px;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(145deg,#475569,#1e293b)}
.play{position:fixed;left:14px;right:14px;bottom:18px;padding:14px;border:3px solid #fff;border-radius:16px;font-size:15px;font-weight:900;color:#5a2d00;background:linear-gradient(180deg,#ffe082,#ffb300);box-shadow:0 5px 0 #a35f00;cursor:pointer}
.empty{text-align:center;font-size:13px;color:#94a3b8;padding:20px 10px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.88);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal.hidden{display:none}
.box{width:100%;max-width:420px;max-height:82vh;display:flex;flex-direction:column;background:#0f172a;border:2px solid #ffd447;border-radius:18px 18px 0 0}
.bh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #334155}
.bh b{font-size:15px;font-weight:900}
.bh button{width:32px;height:32px;border-radius:9px;border:2px solid #fff;background:#c62828;color:#fff;font-weight:900;cursor:pointer}
.bb{overflow-y:auto;padding:10px 14px 20px}
.me{font-size:12.5px;color:#5ee0ff;font-weight:900;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(15,23,42,.6);border:1px solid #334155;margin-bottom:6px;font-size:13px}
.row.me{border-color:#5ee0ff}
.row.cut{border-bottom:3px dashed #f59e0b}
.row .rk{width:34px;font-weight:900;color:#ffd447}
.row .nn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.row .pt{font-weight:900}
.tst{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #475569;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:800;display:none;z-index:60;max-width:88vw;text-align:center}
</style>
</head>
<body>

<div class="head"><button class="back" onclick="location.href='chess-main.html'">‹</button><h1>Турниры</h1></div>
<div class="reg" id="reg"></div>

<div class="path">
  <span data-l="region">Регион</span><i>›</i>
  <span data-l="country">Страна</span><i>›</i>
  <span data-l="continent">Континент</span><i>›</i>
  <span data-l="world">Мир</span>
</div>
<div class="rule">Турнир идёт 24 часа. Очки — за победы в рейтинговых боях. Первые 100 игроков проходят в следующий этап.</div>

<div id="list"><div class="empty">Загружаем…</div></div>

<button class="play" id="play">⚔️ Играть рейтинговый бой</button>

<div id="modal" class="modal hidden">
  <div class="box">
    <div class="bh"><b id="mTitle"></b><button id="mClose">✕</button></div>
    <div class="bb" id="mBody"></div>
  </div>
</div>
<div class="tst" id="tst"></div>

<script>
const sb = supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);
const $ = id => document.getElementById(id);

function playerKey(){
  const t = localStorage.getItem('tgId'); if (t) return 'tg:' + t;
  const e = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (e) return 'email:' + e.toLowerCase();
  let a = localStorage.getItem('arenaAnonId');
  if (!a){ a = 'anon:' + Math.random().toString(36).slice(2,10); localStorage.setItem('arenaAnonId', a); }
  return a;
}
const KEY = playerKey();

const LVL = { region:'Регион', country:'Страна', continent:'Континент', world:'Мир' };
const CONT = { EU:'Европа', AS:'Азия', AF:'Африка', NA:'Северная Америка', SA:'Южная Америка', OC:'Океания', OTHER:'Прочее' };
const ORDER = { region:1, country:2, continent:3, world:4 };

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(t){
  const e = $('tst'); e.textContent = t; e.style.display = 'block';
  clearTimeout(window.__tt); window.__tt = setTimeout(function(){ e.style.display = 'none'; }, 2400);
}
function left(ms){
  if (ms <= 0) return 'подводим итоги';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h + 'ч ' + String(m).padStart(2,'0') + 'м ' + String(x).padStart(2,'0') + 'с';
}
function nameOf(t){
  if (t.level === 'continent') return CONT[t.scope] || t.scope;
  if (t.level === 'world') return 'Весь мир';
  return t.scope_name || t.scope;
}

let reloadAt = 0;

async function load(){
  try {
    const st = await sb.rpc('geo_state', { p_key: KEY });
    const me = await sb.rpc('geo_me', { p_key: KEY });
    const m = (me && me.data) || {};
    $('reg').textContent = m.region_name ? 'Регион: ' + m.region_name : 'Регион не определён';
    if (st.error){ $('list').innerHTML = '<div class="empty">Ошибка: ' + esc(st.error.message) + '</div>'; return; }
    const s = st.data || {};
    if (!s.ok){
      $('list').innerHTML = '<div class="card"><div class="nm">Сначала определи регион</div><button class="btn" onclick="location.href=\'chess-region.html\'">📍 Определить регион</button></div>';
      return;
    }
    render(s.tournaments || []);
  } catch(e){
    $('list').innerHTML = '<div class="empty">Нет связи с сервером. Обнови страницу.</div>';
  }
}

function render(list){
  list.sort(function(a, b){ return (ORDER[a.level] || 9) - (ORDER[b.level] || 9); });
  const have = {};
  list.forEach(function(t){ have[t.level] = true; });
  document.querySelectorAll('.path span').forEach(function(el){
    el.classList.toggle('on', !!have[el.dataset.l]);
  });
  if (!list.length){ $('list').innerHTML = '<div class="empty">Открытых турниров нет.</div>'; return; }

  let h = '';
  list.forEach(function(t){
    h += '<div class="card ' + t.level + '" data-end="' + esc(t.ends_at) + '">' +
      '<div class="ct"><span class="lvl">' + LVL[t.level] + '</span><span class="tm"></span></div>' +
      '<div class="nm">' + esc(nameOf(t)) + '</div>' +
      '<div class="stat">' +
        '<div><span>ТВОИ ОЧКИ</span><b>' + (t.my_points || 0) + '</b></div>' +
        '<div><span>УЧАСТНИКОВ</span><b>' + (t.total || 0) + '</b></div>' +
      '</div>' +
      '<button class="btn" data-board="' + esc(t.id) + '" data-title="' + esc(LVL[t.level] + ': ' + nameOf(t)) + '">Таблица · топ-100 идут дальше</button>' +
    '</div>';
  });
  $('list').innerHTML = h;
  tick();
}

function tick(){
  let expired = false;
  document.querySelectorAll('[data-end]').forEach(function(el){
    const ms = new Date(el.dataset.end) - Date.now();
    el.querySelector('.tm').textContent = ms > 0 ? 'до конца ' + left(ms) : 'подводим итоги…';
    if (ms <= 0) expired = true;
  });
  if (expired && Date.now() - reloadAt > 5000){ reloadAt = Date.now(); load(); }
}

async function board(id, title){
  $('mTitle').textContent = title;
  $('mBody').innerHTML = '<div class="empty">Загружаем…</div>';
  $('modal').classList.remove('hidden');
  try {
    const r = await sb.rpc('geo_board', { p_tid: id, p_key: KEY });
    if (r.error){ $('mBody').innerHTML = '<div class="empty">Ошибка загрузки</div>'; return; }
    const d = r.data || {}, me = d.me;
    let h = '<div class="me">' +
      (me ? ('Ты: ' + me.rank + ' место · ' + me.points + ' очк.') : 'Ты пока без очков') +
      ' · участников: ' + (d.total || 0) + '</div>';
    const top = d.top || [];
    if (!top.length) h += '<div class="empty">Пока никто не набрал очков.<br>Выиграй рейтинговый бой — и ты в таблице.</div>';
    top.forEach(function(p){
      h += '<div class="row' + (p.me ? ' me' : '') + (p.rk === 100 ? ' cut' : '') + '">' +
        '<span class="rk">' + p.rk + '</span>' +
        '<span class="nn">' + esc(p.name || 'Игрок') + '</span>' +
        '<span class="pt">' + p.points + '</span></div>';
    });
    $('mBody').innerHTML = h;
  } catch(e){
    $('mBody').innerHTML = '<div class="empty">Нет связи с сервером</div>';
  }
}

$('list').onclick = function(e){
  const b = e.target.closest('[data-board]');
  if (b) board(b.getAttribute('data-board'), b.getAttribute('data-title'));
};
$('mClose').onclick = function(){ $('modal').classList.add('hidden'); };
$('modal').onclick = function(e){ if (e.target === $('modal')) $('modal').classList.add('hidden'); };

$('play').onclick = function(){
  try { sessionStorage.setItem('arenaAutoQueue', '1'); } catch(e){}
  location.href = 'chess-arena.html';
};

load();
setInterval(tick, 1000);
setInterval(load, 30000);
</script>
</body>
</html>
