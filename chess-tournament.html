<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Турниры — Chess Royale</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#1f7ae0 0%,#0e2a5e 60%);color:#fff;padding:14px 14px 30px;user-select:none}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:38px;height:38px;border-radius:12px;border:3px solid #fff;background:linear-gradient(180deg,#475569,#1e293b);color:#fff;font-size:20px;font-weight:900;cursor:pointer;flex-shrink:0}
h1{font-size:20px;font-weight:900;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sel-btn{padding:10px 8px;border-radius:12px;border:3px solid #fff;background:linear-gradient(180deg,#ffe082,#ffb300);color:#5a2d00;cursor:pointer;box-shadow:0 4px 0 #a35f00;text-align:center}
.sel-btn small{display:block;font-size:10px;font-weight:900;opacity:.75;letter-spacing:.4px;text-transform:uppercase}
.sel-btn b{display:block;font-size:13.5px;font-weight:900;margin-top:2px}
.rule{font-size:11.5px;color:#dbeafe;line-height:1.5;margin-bottom:12px;font-weight:600;background:rgba(15,23,42,.45);border-radius:12px;padding:9px 11px}
.card{background:linear-gradient(145deg,#fff,#eef4ff);border:3px solid #ffd447;border-radius:16px;padding:12px;margin-bottom:10px;color:#132a54;box-shadow:0 5px 0 #b45309}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:10px;font-weight:900;color:#5a7398;letter-spacing:.6px;text-transform:uppercase}
.tm{font-size:11px;font-weight:900;color:#b45309;white-space:nowrap}
.nm{font-size:16px;font-weight:900;margin:4px 0 8px}
.stat{display:flex;gap:6px;margin-bottom:8px}
.stat div{flex:1;padding:6px;border-radius:10px;background:#dbe7fb;text-align:center}
.stat span{display:block;font-size:9px;font-weight:900;color:#5a7398}
.stat b{font-size:15px;font-weight:900}
.bar{height:10px;border-radius:6px;background:#dbe7fb;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#43e97b,#ffd447)}
.btn{width:100%;padding:12px;border:3px solid #fff;border-radius:12px;font-size:13.5px;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(180deg,#22c55e,#15803d);box-shadow:0 4px 0 #0b5426;margin-top:4px}
.btn.sec{background:linear-gradient(180deg,#64748b,#334155);box-shadow:0 4px 0 #111827}
.btn.gem{background:linear-gradient(180deg,#7dd3fc,#2563eb);box-shadow:0 4px 0 #1e3a8a}
.btn:disabled{opacity:.55}
.empty{text-align:center;font-size:13px;color:#dbeafe;padding:20px 10px;line-height:1.5}
.note{font-size:11px;color:#5a7398;margin-top:6px;font-weight:700;text-align:center}

#modal{position:fixed;inset:0;background:rgba(2,6,23,.75);display:none;align-items:center;justify-content:center;padding:18px;z-index:200}
#modal.open{display:flex}
.mbox{width:100%;max-width:400px;background:#fff;border:4px solid #ffd447;border-radius:18px;overflow:hidden;box-shadow:0 8px 0 #b45309}
.mhead{background:linear-gradient(180deg,#3b8ef0,#1d5fc4);padding:14px 14px 14px 18px;display:flex;justify-content:space-between;align-items:center}
.mhead h2{margin:0;font-size:18px;font-weight:900;color:#fff}
.mclose{width:40px;height:40px;border-radius:10px;border:3px solid #fff;background:#ef4444;color:#fff;font-size:18px;font-weight:900;cursor:pointer}
.mbody{padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:3px solid #c7d6ef;background:linear-gradient(180deg,#fff,#eef4ff);box-shadow:0 4px 0 #94a9cc;cursor:pointer;text-align:left;color:#132a54}
.opt .ic{font-size:28px;width:40px;text-align:center;flex-shrink:0}
.opt .t{font-size:15px;font-weight:900;color:#132a54;display:block}
.opt .d{font-size:11.5px;font-weight:700;color:#5a7398;margin-top:2px;line-height:1.3;display:block}
.opt.on{border-color:#ffd447;background:linear-gradient(180deg,#ffe082,#ffb300);box-shadow:0 4px 0 #b45309;color:#5a2d00}
.opt.on .t{color:#5a2d00}
.opt.on .d{color:#7a4300}

#dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,#16306e,#0a1c40);border-top:3px solid #ffd447;padding:12px 14px 18px;display:none;z-index:50}
#dock.open{display:block}
#dockTitle{font-size:15px;font-weight:900;margin-bottom:4px}
#dockSub{font-size:12px;color:#dbeafe;margin-bottom:8px;line-height:1.4}
#dockTimer{font-size:26px;font-weight:900;color:#ffd447;text-align:center;margin:6px 0}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1e293b;border:1px solid #475569;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:800;display:none;z-index:60;max-width:88vw;text-align:center}
</style>
</head>
<body>
<div style="position:fixed;left:8px;bottom:8px;font-size:10px;font-weight:900;color:#facc15;background:#0f172a;border:1px solid #facc15;padding:3px 8px;border-radius:6px;z-index:999">tour-v3</div>

<div class="head"><button class="back" onclick="location.href='chess-main.html'">‹</button><h1>Турниры</h1></div>

<div class="sel-row">
  <button class="sel-btn" id="openType"><small>Турнир</small><b id="typeVal">Чемпионаты</b></button>
  <button class="sel-btn" id="openMode"><small>Режим</small><b id="modeVal">Классика</b></button>
</div>

<div class="rule" id="rule"></div>
<div id="list"><div class="empty">Загружаем…</div></div>

<div id="modal">
  <div class="mbox">
    <div class="mhead"><h2 id="mTitle"></h2><button class="mclose" id="mClose">✕</button></div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<div id="dock">
  <div id="dockTitle">Соперник найден</div>
  <div id="dockSub"></div>
  <div id="dockTimer"></div>
  <button class="btn" id="dockAccept">Принять партию</button>
  <button class="btn sec" id="dockPlay" style="display:none">Начать партию</button>
</div>

<div class="toast" id="toast"></div>

<script>
const sb = supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);
const $ = id => document.getElementById(id);

function playerKey(){
  const t = localStorage.getItem('tgId'); if (t) return 'tg:' + t;
  const e = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (e) return 'email:' + e.toLowerCase();
  let a = localStorage.getItem('arenaAnonId');
  if (!a){ a = 'anon:' + Math.random().toString(36).slice(2,10); localStorage.setItem('arenaAnonId', a); }
  return a;
}
const KEY = playerKey();

const MODES = [
  { id:'classic',  name:'Классика',            icon:'🃏', short:'Карты + эликсир, 5 минут', rule:'Карты и эликсир, общие 5 минут. Ходить можно в любой момент.' },
  { id:'nocards',  name:'Без карт',            icon:'♟',  short:'Эликсир, карт нет',        rule:'Эликсир, карт нет. Общие 5 минут, ходить можно в любой момент.' },
  { id:'noelixir', name:'Без эликсира',        icon:'⏱️', short:'По очереди, по 3 мин',     rule:'Карты есть, эликсира нет. Ходы по очереди, по 3 минуты на каждого.' },
  { id:'pure',     name:'Без карт и эликсира', icon:'⚔️', short:'По очереди, по 3 мин',     rule:'Только шахматы. Ходы по очереди, по 3 минуты на каждого.' }
];
const TYPES = [
  { id:'champ', name:'Чемпионаты', icon:'🏆', short:'Игра с соперником с таким же числом очков',
    rule:'Чемпионат: играешь с соперником с таким же числом очков. Первые 100 проходят в следующий этап. Принимай партию в течение 5 минут, иначе засчитывается поражение.' },
  { id:'basic', name:'Обычное испытание', icon:'🎯', short:'Вход 10 💎 · 12 побед или 3 поражения',
    rule:'Обычное испытание: вход 10 💎. Соперник с таким же числом побед. 12 побед — испытание пройдено, 3 поражения — выбываешь.' },
  { id:'premium', name:'Крупное испытание', icon:'💠', short:'Вход 100 💎 · призы в 10 раз больше',
    rule:'Крупное испытание: вход 100 💎. Соперник с таким же числом побед. 12 побед — испытание пройдено, 3 поражения — выбываешь. Призы в 10 раз больше обычного.' }
];
const MODE_BY_ID = {}; MODES.forEach(m => MODE_BY_ID[m.id] = m);
const TYPE_BY_ID = {}; TYPES.forEach(t => TYPE_BY_ID[t.id] = t);
const TRIAL_COST = { basic: 10, premium: 100 };

const CONT = { EU:'Европа', AS:'Азия', AF:'Африка', NA:'Северная Америка', SA:'Южная Америка', OC:'Океания', OTHER:'Прочее' };
const LVL = { region:'Регион', country:'Страна', continent:'Континент', world:'Мир' };
const STATE_TXT = { none:'Не в турнире', idle:'Не в очереди', free:'Ищем соперника', busy:'В партии', out:'Выбыл' };

let type = 'champ';
let mode = (function(){ const v = localStorage.getItem('arenaMode'); return MODE_BY_ID[v] ? v : 'classic'; })();
let dockMatch = null, dockTimer = null;

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(t){
  const e = $('toast'); e.textContent = t; e.style.display = 'block';
  clearTimeout(window.__tt); window.__tt = setTimeout(function(){ e.style.display = 'none'; }, 2600);
}
function rpc(name, args){
  return sb.rpc(name, args).then(function(r){
    if (r.error) throw new Error(r.error.message);
    return r.data || {};
  });
}
function left(ms){
  if (ms <= 0) return '0:00';
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function nameOf(t){
  if (t.level === 'continent') return CONT[t.scope] || t.scope;
  if (t.level === 'world') return 'Весь мир';
  return t.scope_name || t.scope;
}

function renderTop(){
  $('typeVal').textContent = TYPE_BY_ID[type].name;
  $('modeVal').textContent = MODE_BY_ID[mode].name;
  $('rule').textContent = TYPE_BY_ID[type].rule + (type === 'champ' ? ' Режим: ' + MODE_BY_ID[mode].rule : '');
}

/* ---------- окно выбора ---------- */

let modalKind = null;
function openModal(kind){
  modalKind = kind;
  const isType = kind === 'type';
  $('mTitle').textContent = isType ? 'Тип турнира' : 'Режим боя';
  const list = isType ? TYPES : MODES;
  const cur = isType ? type : mode;
  $('mBody').innerHTML = list.map(function(o){
    return '<button class="opt' + (o.id === cur ? ' on' : '') + '" data-id="' + o.id + '">' +
      '<span class="ic">' + o.icon + '</span>' +
      '<span><span class="t">' + esc(o.name) + '</span>' +
      '<span class="d">' + esc(o.short) + '</span></span></button>';
  }).join('');
  $('modal').classList.add('open');
}
function closeModal(){ $('modal').classList.remove('open'); modalKind = null; }

$('openType').onclick = function(){ openModal('type'); };
$('openMode').onclick = function(){ openModal('mode'); };
$('mClose').onclick = closeModal;
$('modal').onclick = function(e){ if (e.target === $('modal')) closeModal(); };
$('mBody').onclick = function(e){
  const b = e.target.closest('[data-id]'); if (!b) return;
  if (modalKind === 'type'){
    type = b.dataset.id;
  } else {
    mode = b.dataset.id;
    try { localStorage.setItem('arenaMode', mode); } catch(err){}
  }
  closeModal();
  renderTop(); loadList();
};

/* ---------- чемпионаты ---------- */

async function loadChamp(){
  const d = await rpc('geo_state', { p_key: KEY });
  if (!d.ok){
    $('list').innerHTML = '<div class="card"><div class="nm">Сначала определи регион</div><button class="btn" onclick="location.href=\'chess-region.html\'">📍 Определить регион</button></div>';
    return;
  }
  const list = (d.tournaments || []).filter(function(t){ return t.level !== 'trial'; });
  if (!list.length){ $('list').innerHTML = '<div class="empty">Открытых чемпионатов нет.</div>'; return; }
  $('list').innerHTML = list.map(champCard).join('');
}

function champCard(t){
  const st = t.my_state || 'none';
  let btn = '';
  if (st === 'none' || st === 'idle') btn = '<button class="btn" data-join="' + esc(t.id) + '">Участвовать</button>';
  else if (st === 'free') btn = '<button class="btn sec" data-leave="' + esc(t.id) + '">Выйти из очереди</button>';
  else if (st === 'busy') btn = '<button class="btn sec" disabled>В партии</button>';
  else btn = '<button class="btn sec" disabled>Выбыл на этом этапе</button>';

  return '<div class="card">' +
    '<div class="ct"><span class="lvl">' + LVL[t.level] + '</span><span class="tm" data-end="' + esc(t.ends_at) + '"></span></div>' +
    '<div class="nm">' + esc(nameOf(t)) + '</div>' +
    '<div class="stat">' +
      '<div><span>ТВОЁ СОСТОЯНИЕ</span><b style="font-size:11px">' + esc(STATE_TXT[st] || st) + '</b></div>' +
      '<div><span>ОЧКИ</span><b>' + (t.my_points || 0) + '</b></div>' +
      '<div><span>УЧАСТНИКОВ</span><b>' + (t.total || 0) + '</b></div>' +
    '</div>' + btn + '</div>';
}

/* ---------- испытания ---------- */

async function loadTrial(){
  const cost = TRIAL_COST[type];
  const d = await rpc('trial_active', { p_key: KEY, p_type: type });
  const s = d.session;
  const m = MODE_BY_ID[mode];
  const title = TYPE_BY_ID[type].name;

  let wins = 0, losses = 0, stateLabel = 'Не начато', btn = '';

  if (!s){
    btn = '<button class="btn gem" data-trial-start="1">Начать · ' + cost + ' 💎</button>';
  } else {
    wins = s.wins; losses = s.losses;
    if (s.state === 'active'){
      stateLabel = 'Идёт испытание';
      btn = '<button class="btn" data-trial-find="1">Искать соперника</button>';
    } else {
      stateLabel = s.state === 'complete' ? 'Испытание пройдено' : 'Испытание окончено';
      btn = '<button class="btn" data-trial-claim="' + esc(s.id) + '">Забрать приз</button>';
    }
  }

  $('list').innerHTML = '<div class="card">' +
    '<div class="ct"><span class="lvl">' + esc(title) + '</span><span class="tm">' + esc(m.name) + '</span></div>' +
    '<div class="nm">' + esc(stateLabel) + '</div>' +
    '<div class="stat">' +
      '<div><span>ПОБЕДЫ</span><b>' + wins + ' / 12</b></div>' +
      '<div><span>ПОРАЖЕНИЯ</span><b>' + losses + ' / 3</b></div>' +
    '</div>' +
    '<div class="bar"><i style="width:' + Math.min(100, wins / 12 * 100) + '%"></i></div>' +
    btn +
    '<div class="note">Соперник подбирается с таким же числом побед</div></div>';
}

/* ---------- список ---------- */

async function loadList(){
  try {
    if (type === 'champ') await loadChamp(); else await loadTrial();
  } catch(e){
    $('list').innerHTML = '<div class="empty">Нет связи с сервером: ' + esc(e.message) + '</div>';
  }
}

$('list').onclick = async function(e){
  const j = e.target.closest('[data-join]');
  const l = e.target.closest('[data-leave]');
  const ts = e.target.closest('[data-trial-start]');
  const tf = e.target.closest('[data-trial-find]');
  const tc = e.target.closest('[data-trial-claim]');
  try {
    if (j){
      const r = await rpc('tour_champ_join', { p_key: KEY, p_t: j.dataset.join, p_mode: mode });
      if (!r.ok) toast(r.error); else toast('Ты в очереди');
    } else if (l){
      await rpc('tour_leave', { p_key: KEY, p_t: l.dataset.leave });
      toast('Вышел из очереди');
    } else if (ts){
      const r = await rpc('trial_start', { p_key: KEY, p_mode: mode, p_type: type });
      if (!r.ok) toast(r.error); else toast('Испытание начато');
    } else if (tf){
      const r = await rpc('tour_trial_join', { p_key: KEY, p_mode: mode });
      if (!r.ok) toast(r.error); else toast('Ищем соперника…');
    } else if (tc){
      const r = await rpc('trial_reward', { p_session: tc.dataset.trialClaim, p_key: KEY });
      if (!r.ok) toast(r.error);
      else toast('Приз: ' + r.gems + ' 💎, ' + r.coins + ' 🪙');
    } else return;
  } catch(err){ toast(err.message || 'Ошибка'); }
  loadList(); pollMatch();
};

/* ---------- принятие партии ---------- */

function showDock(m){
  dockMatch = m;
  $('dock').classList.add('open');
  $('dockTitle').textContent = m.status === 'pending' ? 'Соперник найден' : 'Партия готова';
  $('dockSub').textContent = 'Соперник: ' + (m.opp_name || 'Игрок') + ' · ' + (m.opp_cups || 0) + ' 🏆 · ' +
    (MODE_BY_ID[m.mode] || MODES[0]).name +
    (m.kind === 'trial' ? ' · испытание' : ' · чемпионат');

  const accept = $('dockAccept'), play = $('dockPlay');
  if (m.status === 'pending'){
    accept.style.display = m.my_ok ? 'none' : 'block';
    accept.disabled = false;
    play.style.display = 'none';
  } else if (m.status === 'active'){
    accept.style.display = 'none';
    play.style.display = 'block';
  }
  if (!dockTimer) dockTimer = setInterval(tickDock, 500);
  tickDock();
}

function tickDock(){
  if (!dockMatch) return;
  if (dockMatch.status === 'pending'){
    const dl = new Date(dockMatch.deadline) - Date.now();
    $('dockTimer').textContent = dockMatch.my_ok ? 'Ждём соперника…' : 'Принять за ' + left(dl);
  } else {
    $('dockTimer').textContent = '';
  }
}

function hideDock(){
  dockMatch = null;
  $('dock').classList.remove('open');
  if (dockTimer){ clearInterval(dockTimer); dockTimer = null; }
}

$('dockAccept').onclick = async function(){
  if (!dockMatch) return;
  $('dockAccept').disabled = true;
  try {
    const r = await rpc('tour_accept', { p_match: dockMatch.id, p_key: KEY });
    if (!r.ok) toast(r.error);
  } catch(e){ toast(e.message); }
  $('dockAccept').disabled = false;
  pollMatch();
};

$('dockPlay').onclick = function(){
  if (!dockMatch) return;
  try {
    sessionStorage.setItem('tourStart', JSON.stringify({
      matchId: dockMatch.id, side: dockMatch.side, oppKey: dockMatch.opp_key,
      oppName: dockMatch.opp_name, oppCups: dockMatch.opp_cups,
      mode: dockMatch.mode, kind: dockMatch.kind
    }));
  } catch(e){}
  location.href = 'chess-arena.html';
};

async function pollMatch(){
  try {
    const d = await rpc('tour_my_match', { p_key: KEY });
    const m = d.match;
    if (!m){ hideDock(); return; }
    showDock(m);
  } catch(e){}
}

setInterval(pollMatch, 2000);
setInterval(function(){
  document.querySelectorAll('[data-end]').forEach(function(el){
    const ms = new Date(el.dataset.end) - Date.now();
    el.textContent = ms > 0 ? 'до конца ' + left(ms) : 'подводим итоги…';
  });
}, 1000);
setInterval(function(){ if (type === 'champ') loadList(); }, 15000);

renderTop();
loadList();
pollMatch();
</script>
</body>
</html>
