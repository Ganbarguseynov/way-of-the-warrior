<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рейтинг</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { margin: 0; background: #000; color: #fff; padding: 14px 12px 30px; }
h1 { font-size: 22px; text-align: center; margin: 6px 0 12px; }
.back { background: none; border: none; color: #5ac8fa; font-size: 14px; padding: 0 0 10px; cursor: pointer; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
.tab.on { background: #ffcc00; color: #000; border-color: #ffcc00; }
.row { display: flex; align-items: center; background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px; padding: 10px; margin-bottom: 8px; }
.row.me { border-color: #ffcc00; }
.rank { width: 30px; text-align: center; font-weight: 900; color: #ffcc00; font-size: 15px; flex-shrink: 0; }
.ava { width: 34px; height: 34px; border-radius: 50%; background: #2c2c2e; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 8px; flex-shrink: 0; }
.info { flex: 1; min-width: 0; }
.name { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font-size: 11px; color: #8e8e93; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.val { font-size: 13px; font-weight: 900; color: #ffcc00; text-align: right; flex-shrink: 0; }
.box { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.muted { color: #8e8e93; font-size: 12px; text-align: center; padding: 24px 0; line-height: 1.5; }
input, select { width: 100%; padding: 10px; border-radius: 8px; background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c; font-size: 14px; margin-bottom: 8px; }
.btn { width: 100%; padding: 11px; border-radius: 10px; border: none; background: #ffcc00; color: #000; font-weight: 800; font-size: 14px; cursor: pointer; }
.btn.alt { background: #ff3b30; color: #fff; }
h3 { font-size: 15px; margin: 16px 0 8px; }
</style>
</head>
<body>
<button class="back" onclick="location.href='index.html'">← Назад в приложение</button>
<h1>🏆 Рейтинг</h1>

<div class="tabs">
<button class="tab on" id="t-p" onclick="setTab('p')">Игроки</button>
<button class="tab" id="t-c" onclick="setTab('c')">Кланы</button>
</div>

<div id="list"></div>
<div id="clan-box" style="display: none;"></div>

<script>
const sb = supabase.createClient('https://qnpriwfxzuoymoumdtrl.supabase.co', 'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF');
const $ = id => document.getElementById(id);

const KEY = (function(){
  const t = localStorage.getItem('tgId');
  if (t) return 'tg:' + t;
  const e = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (e) return 'email:' + e.toLowerCase();
  return null;
})();

const TH = [0, 100, 250, 450, 700, 1000, 1400, 1900, 2500, 3500];
const TM = ['Странник', 'Берсерк', 'Мечник', 'Ветеран', 'Гладиатор', 'Чемпион', 'Мастер клинка', 'Воевода', 'Легенда', 'Бессмертный'];
const TF = ['Новичок', 'Фурия', 'Амазонка', 'Валькирия', 'Воительница', 'Победительница', 'Королева клинка', 'Владычица', 'Легенда', 'Бессмертная'];
const AV = ['👑', '😎', '😈', '🤠', '🤖', '🐺', '🦊', '🐻', '🐯', '🦁', '👽', '🎃', '💀', '🧙', '🥷'];

let TAB = 'p';

function levelOf(xp){
  let n = 1;
  for (let i = 0; i < TH.length; i++) if (xp >= TH[i]) n = i + 1;
  return n;
}

function titleOf(xp){
  let female = false;
  try { female = JSON.parse(localStorage.getItem('cachedProfile') || '{}').gender === 'female'; } catch (e) {}
  const arr = female ? TF : TM;
  return arr[levelOf(xp) - 1] || arr[0];
}

function hpOf(xp){ return 100 + levelOf(xp) * 10; }

function avaFor(s){
  let h = 0;
  const str = String(s || '');
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) & 0xffff;
  return AV[h % AV.length];
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function medal(i){ return i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : String(i + 1); }

function setTab(t){
  TAB = t;
  $('t-p').classList.toggle('on', t === 'p');
  $('t-c').classList.toggle('on', t === 'c');
  $('clan-box').style.display = t === 'c' ? 'block' : 'none';
  if (t === 'p') loadPlayers();
  else loadClans();
}

async function loadPlayers(){
  $('list').innerHTML = '<p class="muted">Загрузка…</p>';
  const { data, error } = await sb.rpc('sport_top', { p_limit: 50 });
  if (error) {
    $('list').innerHTML = '<p class="muted">Не удалось загрузить рейтинг.<br>' + esc(error.message) + '</p>';
    return;
  }
  const rows = data || [];
  if (!rows.length) {
    $('list').innerHTML = '<p class="muted">Пока нет игроков с опытом.</p>';
    return;
  }
  $('list').innerHTML = rows.map((r, i) => {
    const xp = r.xp || 0;
    const me = KEY && r.player_key === KEY;
    return '<div class="row' + (me ? ' me' : '') + '">' +
      '<div class="rank">' + medal(i) + '</div>' +
      '<div class="ava">' + avaFor(r.name) + '</div>' +
      '<div class="info">' +
        '<div class="name">' + esc(r.name || 'Атлет') + (me ? ' · ты' : '') + '</div>' +
        '<div class="meta">Ур. ' + levelOf(xp) + ' · ' + titleOf(xp) + ' · HP ' + hpOf(xp) + '</div>' +
      '</div>' +
      '<div class="val">' + xp + ' XP</div>' +
    '</div>';
  }).join('');
}

async function loadClans(){
  $('list').innerHTML = '<p class="muted">Загрузка…</p>';
  const { data, error } = await sb.rpc('sport_clan_top', { p_limit: 50 });
  const rows = data || [];
  let myClanId = null;
  if (KEY) {
    const mine = await sb.from('sport_clan_members').select('clan_id').eq('player_key', KEY).limit(1);
    if (mine.data && mine.data.length) myClanId = String(mine.data[0].clan_id);
  }
  if (error) {
    $('list').innerHTML = '<p class="muted">Не удалось загрузить кланы.<br>' + esc(error.message) + '</p>';
    renderClanBox(myClanId);
    return;
  }
  if (!rows.length) {
    $('list').innerHTML = '<p class="muted">Кланов пока нет. Создайте первый ниже.</p>';
    renderClanBox(myClanId);
    return;
  }
  $('list').innerHTML = rows.map((c, i) => {
    const mine = myClanId && String(c.id) === myClanId;
    return '<div class="row' + (mine ? ' me' : '') + '">' +
      '<div class="rank">' + medal(i) + '</div>' +
      '<div class="ava">' + esc(c.emblem || '🛡️') + '</div>' +
      '<div class="info">' +
        '<div class="name">' + esc(c.name) + (c.tag ? ' #' + esc(c.tag) : '') + (mine ? ' · мой' : '') + '</div>' +
        '<div class="meta">' + (c.members || 0) + ' участников</div>' +
      '</div>' +
      '<div class="val">' + (c.xp || 0) + ' XP</div>' +
    '</div>';
  }).join('');
  renderClanBox(myClanId);
}

async function renderClanBox(myClanId){
  const box = $('clan-box');
  if (!KEY) {
    box.innerHTML = '<div class="box"><div class="muted" style="padding:0;">Войдите в аккаунт на главной, чтобы вступать в кланы.</div></div>';
    return;
  }
  if (myClanId) {
    const { data } = await sb.from('sport_clans').select('*').eq('id', myClanId).limit(1);
    const c = data && data[0];
    box.innerHTML = '<div class="box">' +
      '<div style="font-size:14px; font-weight:800; margin-bottom:6px;">Мой клан: ' + esc(c ? c.emblem + ' ' + c.name : '—') + '</div>' +
      '<button class="btn alt" onclick="leaveClan()">Покинуть клан</button>' +
      '</div>';
    return;
  }
  box.innerHTML = '<div class="box">' +
    '<h3 style="margin-top:0;">Создать клан</h3>' +
    '<input id="c-name" placeholder="Название клана" maxlength="24">' +
    '<input id="c-tag" placeholder="Тег, до 4 символов" maxlength="4">' +
    '<select id="c-emb"><option>🛡️</option><option>🔥</option><option>⚡</option><option>🐺</option><option>🦁</option><option>💪</option></select>' +
    '<button class="btn" onclick="createClan()">Создать</button>' +
    '</div>' +
    '<div class="box">' +
    '<h3 style="margin-top:0;">Вступить по тегу</h3>' +
    '<input id="j-tag" placeholder="Тег клана" maxlength="4">' +
    '<button class="btn" onclick="joinClan()">Вступить</button>' +
    '</div>';
}

async function createClan(){
  const name = ($('c-name').value || '').trim();
  const tag = ($('c-tag').value || '').trim().toUpperCase();
  const emblem = $('c-emb').value;
  if (name.length < 2) { alert('Введите название клана'); return; }
  if (!KEY) { alert('Войдите в аккаунт'); return; }
  const check = await sb.from('sport_clans').select('id').eq('name', name).limit(1);
  if (check.data && check.data.length) { alert('Клан с таким названием уже есть'); return; }
  const ins = await sb.from('sport_clans').insert([{ name: name, tag: tag || null, emblem: emblem, owner_key: KEY }]).select('id');
  if (ins.error || !ins.data || !ins.data.length) {
    alert('Не удалось создать клан: ' + (ins.error ? ins.error.message : 'нет ответа'));
    return;
  }
  const clanId = ins.data[0].id;
  const mem = await sb.from('sport_clan_members').insert([{ clan_id: clanId, player_key: KEY, role: 'owner' }]);
  if (mem.error) { alert('Клан создан, но вступление не сохранилось: ' + mem.error.message); return; }
  loadClans();
}

async function joinClan(){
  const tag = ($('j-tag').value || '').trim().toUpperCase();
  if (!tag) { alert('Введите тег'); return; }
  if (!KEY) { alert('Войдите в аккаунт'); return; }
  const find = await sb.from('sport_clans').select('id,name').eq('tag', tag).limit(1);
  if (!find.data || !find.data.length) { alert('Клан с таким тегом не найден'); return; }
  const clanId = find.data[0].id;
  const mem = await sb.from('sport_clan_members').insert([{ clan_id: clanId, player_key: KEY, role: 'member' }]);
  if (mem.error) { alert('Не удалось вступить: ' + mem.error.message); return; }
  alert('Вы вступили в клан «' + find.data[0].name + '»');
  loadClans();
}

async function leaveClan(){
  if (!KEY) return;
  if (!confirm('Покинуть клан?')) return;
  const mine = await sb.from('sport_clan_members').select('clan_id,role').eq('player_key', KEY).limit(1);
  if (!mine.data || !mine.data.length) return;
  const clanId = mine.data[0].clan_id;
  await sb.from('sport_clan_members').delete().eq('clan_id', clanId).eq('player_key', KEY);
  if (mine.data[0].role === 'owner') {
    if (confirm('Вы владелец. Удалить клан целиком?')) {
      await sb.from('sport_clans').delete().eq('id', clanId);
    }
  }
  loadClans();
}

setTab('p');
</script>
</body>
</html>
