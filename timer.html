<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Таймер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="timer-view" class="inner-screen">
<button class="back-btn" onclick="goBackToMain()">← Назад в приложение</button>
<h1 style="text-align: center;">Таймер</h1>
<p style="text-align: center; color: var(--hint-color);">Отдых между подходами</p>

<div class="timer-display" id="timer-display">00:45</div>

<div style="display: flex; gap: 15px;">
<button class="btn" onclick="toggleTimer()" id="timer-btn">Старт</button>
<button class="btn" style="background-color: #2c2c2e; color: white;" onclick="resetTimer()">Сброс</button>
</div>

<button class="btn" style="background-color: #34c759; color: white; margin-top: 20px;" onclick="completeSet()">Подход выполнен (+15 XP)</button>
<button class="btn" style="background-color: transparent; color: #ff3b30; margin-top: auto;" onclick="finishWorkout()">Завершить 🏁</button>
</div>

<div id="finish-view" class="inner-screen" style="display: none; text-align: center; justify-content: center;">
<h1 style="font-size: 80px; margin-bottom: 10px;">🏆</h1>
<h2>Тренировка завершена!</h2>
<p id="finish-stats" style="color: #8e8e93; margin-bottom: 30px;">Ты сжег 0 ккал.</p>

<div class="quote-box">
<p id="finish-quote" style="font-style: italic; font-size: 18px; margin-bottom: 10px;">"Цитата"</p>
<p id="finish-author" style="text-align: right; font-weight: bold; font-size: 14px; color: var(--hint-color);">— Автор</p>
</div>

<button class="btn" onclick="goBackToMain()">Принять</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const DEFAULT_MS = 45000;
let isRunning = false;
let remainingMs = DEFAULT_MS;
let endAt = 0;
let timerInterval = null;
let sessionCalories = 0;

function updateDisplay(ms) {
  const sec = Math.ceil(Math.max(0, ms) / 1000);
  document.getElementById('timer-display').innerText = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
}

function setButton(text) {
  document.getElementById('timer-btn').innerText = text;
}

function toggleTimer() {
  if (isRunning) {
    remainingMs = Math.max(0, endAt - Date.now());
    clearInterval(timerInterval);
    isRunning = false;
    setButton("Старт");
    updateDisplay(remainingMs);
    return;
  }
  if (remainingMs <= 0) remainingMs = DEFAULT_MS;
  endAt = Date.now() + remainingMs;
  isRunning = true;
  setButton("Пауза");
  timerInterval = setInterval(() => {
    const left = endAt - Date.now();
    if (left <= 0) {
      clearInterval(timerInterval);
      remainingMs = 0;
      isRunning = false;
      setButton("Старт");
      updateDisplay(0);
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
      tg.showAlert("Время вышло!");
      return;
    }
    remainingMs = left;
    updateDisplay(left);
  }, 250);
}

function resetTimer() {
  clearInterval(timerInterval);
  isRunning = false;
  remainingMs = DEFAULT_MS;
  updateDisplay(remainingMs);
  setButton("Старт");
}

function completeSet() {
  sessionCalories += 15;
  let pending = localStorage.getItem('cachedXP') || 0;
  localStorage.setItem('cachedXP', parseInt(pending) + 15);
  tg.showAlert("+15 XP добавлено!");
}

function finishWorkout() {
  const winAudio = new Audio("12. Scroll Win 02.mp3");
  winAudio.play().catch(e => console.log("Ошибка звука победы:", e));

  document.getElementById('finish-stats').innerText = `Отличная работа. Ты сжег ${sessionCalories} ккал.`;

  let q = { text: "Ты не проиграл, пока не остановился.", author: "Майк Тайсон" };
  if (typeof allQuotes !== 'undefined' && allQuotes.length > 0) {
    q = allQuotes[Math.floor(Math.random() * allQuotes.length)];
  }

  document.getElementById('finish-quote').innerText = `«${q.text}»`;
  document.getElementById('finish-author').innerText = `— ${q.author}`;

  document.getElementById('timer-view').style.display = 'none';
  document.getElementById('finish-view').style.display = 'flex';
}

function goBackToMain() {
  setTimeout(() => { window.location.href = 'index.html'; }, 100);
}
</script>
<script src="quotes.js"></script>
</body>
</html>
