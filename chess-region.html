<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Регион — Chess Royale</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{margin:0;min-height:100dvh;background:#0f172a;color:#fff;padding:18px 16px 40px}
h1{font-size:20px;font-weight:900;margin:0 0 6px}
.sub{font-size:12.5px;color:#94a3b8;line-height:1.5;margin-bottom:16px}
.card{background:linear-gradient(145deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:900;margin:0 0 6px}
.card p{font-size:12px;color:#94a3b8;margin:0 0 12px;line-height:1.45}
.state{font-size:13px;font-weight:800;min-height:18px;line-height:1.4}
.ok{color:#5ef08a}.bad{color:#fca5a5}.wait{color:#5ee0ff}
button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:11px;font-size:14px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(145deg,#22c55e,#15803d)}
button:disabled{background:#334155;color:#64748b}
button.sec{background:linear-gradient(145deg,#475569,#1e293b)}
.badge{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:7px;margin-left:6px}
.badge.on{background:#14532d;color:#86efac}
.badge.off{background:#451a03;color:#fcd34d}
</style>
</head>
<body>

<h1>Твой регион</h1>
<div class="sub">Регион определяется по GPS автоматически. Он нужен для турниров своей области и страны. Менять регион можно раз в 30 дней.</div>

<div class="card">
  <h2>Местоположение <span id="gpsBadge" class="badge off">проверяем</span></h2>
  <div class="state wait" id="regionState">Определяем регион…</div>
  <button id="retry" style="display:none">📍 Попробовать снова</button>
</div>

<div class="card" id="phoneCard" style="display:none">
  <h2>Номер телефона <span id="phoneBadge" class="badge off">нет</span></h2>
  <p>Подтверди номер — это защищает турниры от подмены региона.</p>
  <div class="state" id="phoneState"></div>
  <button id="phoneBtn" class="sec">📱 Поделиться номером</button>
</div>

<script>
const sb=supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);
const tg=window.Telegram&&window.Telegram.WebApp;
try{ tg&&tg.ready(); tg&&tg.expand(); }catch(e){}
const $=id=>document.getElementById(id);

function playerKey(){
  const t=localStorage.getItem('tgId'); if(t) return 'tg:'+t;
  const e=localStorage.getItem('currentEmail')||localStorage.getItem('linkedEmail');
  if(e) return 'email:'+e.toLowerCase();
  let a=localStorage.getItem('arenaAnonId');
  if(!a){ a='anon:'+Math.random().toString(36).slice(2,10); localStorage.setItem('arenaAnonId',a); }
  return a;
}
const KEY=playerKey();

function setState(cls,txt){ const e=$('regionState'); e.className='state '+cls; e.textContent=txt; }
function showRetry(show){ $('retry').style.display=show?'block':'none'; }

function getPos(){
  return new Promise((ok,err)=>{
    if(!navigator.geolocation){ err(new Error('Геолокация недоступна в этом приложении')); return; }
    navigator.geolocation.getCurrentPosition(
      p=>ok(p.coords),
      e=>{
        if(e.code===1) err(new Error('Доступ к геолокации запрещён. Разреши его в настройках браузера для этого сайта.'));
        else if(e.code===2) err(new Error('Местоположение недоступно. Включи GPS в настройках телефона.'));
        else err(new Error('Не удалось определить местоположение. Попробуй у окна или на улице.'));
      },
      { enableHighAccuracy:false, timeout:25000, maximumAge:600000 }
    );
  });
}

function makeRegion(cc,st,countryName){
  if(!cc||!st) return null;
  return { code: cc+':'+st, name: st+', '+(countryName||cc) };
}

async function viaNominatim(lat,lon){
  const u='https://nominatim.openstreetmap.org/reverse?format=json&zoom=5&accept-language=ru&lat='+lat+'&lon='+lon;
  const r=await fetch(u,{headers:{'Accept':'application/json'}});
  if(!r.ok) return null;
  const j=await r.json(); const a=j.address||{};
  return makeRegion((a.country_code||'').toUpperCase(), a.state||a.region||a.county, a.country);
}

async function viaBigData(lat,lon){
  const u='https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=ru';
  const r=await fetch(u);
  if(!r.ok) return null;
  const j=await r.json();
  return makeRegion((j.countryCode||'').toUpperCase(), j.principalSubdivision, j.countryName);
}

async function regionFrom(lat,lon){
  let r=null;
  try{ r=await viaNominatim(lat,lon); }catch(e){}
  if(!r){ try{ r=await viaBigData(lat,lon); }catch(e){} }
  return r;
}

async function saveRegion(rc){
  const res=await sb.rpc('set_region',{p_key:KEY,p_code:rc.code,p_name:rc.name,p_lat:0,p_lon:0});
  const d=res.data||{};
  if(res.error||d.ok===false) throw new Error(d.error||res.error.message||'Ошибка сохранения');
}

async function loadStatus(){
  try{
    const r=await sb.rpc('my_region',{p_key:KEY});
    const d=r.data||{};
    if(d.region_name){
      $('gpsBadge').className='badge on'; $('gpsBadge').textContent='готово';
      setState('ok','Регион: '+d.region_name);
      showRetry(false);
      showPhone(d);
      return true;
    }
  }catch(e){}
  return false;
}

function showPhone(d){
  $('phoneCard').style.display='block';
  if(d&&d.phone_verified){
    $('phoneBadge').className='badge on'; $('phoneBadge').textContent='да';
    $('phoneState').className='state ok'; $('phoneState').textContent='Номер подтверждён';
    $('phoneBtn').style.display='none';
  }
}

async function detect(){
  $('gpsBadge').className='badge off'; $('gpsBadge').textContent='проверяем';
  setState('wait','Определяем регион…'); showRetry(false);
  try{
    const c=await getPos();
    const rc=await regionFrom(c.latitude,c.longitude);
    if(!rc) throw new Error('Не удалось определить область по координатам');
    await saveRegion(rc);
    $('gpsBadge').className='badge on'; $('gpsBadge').textContent='готово';
    setState('ok','Регион: '+rc.name);
    const r=await sb.rpc('my_region',{p_key:KEY});
    showPhone(r.data||{});
  }catch(e){
    $('gpsBadge').className='badge off'; $('gpsBadge').textContent='ошибка';
    setState('bad', e.message||'Ошибка');
    showRetry(true);
    showPhone(null);
  }
}

$('retry').onclick=detect;

$('phoneBtn').onclick=function(){
  if(!tg||!tg.requestContact){
    $('phoneState').className='state bad';
    $('phoneState').textContent='Открой игру из бота — в браузере номер передать нельзя.';
    return;
  }
  $('phoneState').className='state wait';
  $('phoneState').textContent='Ждём подтверждения…';
  tg.requestContact(function(sent){
    if(sent){ setTimeout(loadStatus,4000); }
    else{ $('phoneState').className='state bad'; $('phoneState').textContent='Номер не передан'; }
  });
};

(async function(){
  const had=await loadStatus();
  if(!had) detect();
  else { const r=await sb.rpc('my_region',{p_key:KEY}); showPhone(r.data||{}); }
})();
</script>
</body>
</html>
