<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренировка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
:root{
  --ink:#dde3e7;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }

/* ================= НАСТРОЙКА ================= */
.tabs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0 18px; }
.tab{
  padding:13px; border-radius:12px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);
  color:#8e8e93; font-size:14px; font-weight:700; cursor:pointer;
  transition:.18s;
}
.tab.on{
  background:linear-gradient(135deg,#ffcc00,#ffd700);
  color:#000; border-color:#ffcc00;
  box-shadow:0 4px 14px rgba(255,204,0,.22);
}
.pane{ display:none; }
.pane.on{ display:block; }

.empty{
  background:rgba(255,255,255,.04);
  border:1px dashed rgba(255,255,255,.14);
  border-radius:16px;
  padding:38px 22px;
  text-align:center;
}
.empty-icon{ font-size:44px; margin-bottom:12px; }
.empty-title{ font-size:17px; font-weight:800; margin-bottom:8px; }
.empty-text{ font-size:13px; color:#8e8e93; line-height:1.55; }

.wk-sec{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}
.wk-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px;
}
.wk-row.col{ display:block; }
.wk-label{
  font-size:13px; font-weight:600; color:#d1d1d6;
  display:block; margin-bottom:8px;
}
.wk-row .wk-label{ margin-bottom:0; }
.wk-chips{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
}
.wk-chips::-webkit-scrollbar{ display:none; }
.wk-chip{
  flex:0 0 auto; padding:9px 14px; border-radius:11px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  color:#fff; font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:.18s;
}
.wk-chip.on{
  background:linear-gradient(135deg,#ffcc00,#ffd700);
  color:#000; border-color:#ffcc00;
}
.wk-stepper{
  display:flex; align-items:center; gap:4px;
  background:rgba(0,0,0,.35); border-radius:12px; padding:3px;
}
.wk-stepper button{
  width:34px; height:34px; border-radius:9px; border:none;
  background:rgba(255,255,255,.09); color:#fff;
  font-size:19px; font-weight:700; line-height:1; cursor:pointer;
}
.wk-stepper span{
  min-width:42px; text-align:center;
  font-size:17px; font-weight:700; color:#ffcc00;
}
.wk-custom{
  display:grid; grid-template-columns:1fr 1fr 1.4fr 44px;
  gap:6px; margin-top:6px;
}
.wk-custom input,.wk-custom select{
  padding:10px 6px; border-radius:10px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.3); color:#fff;
  font-size:13px; text-align:center; outline:none;
}
.wk-custom select{ text-align:left; padding-left:8px; font-size:12px; }
.wk-custom button{
  border-radius:10px; border:none;
  background:linear-gradient(135deg,#ffcc00,#ffd700);
  color:#000; font-weight:800; font-size:15px; cursor:pointer;
}
.wk-summary{
  font-size:12px; color:#8e8e93; text-align:center;
  margin-top:12px; line-height:1.6;
}
.wk-start{
  width:100%; padding:16px; border-radius:14px; border:none;
  background:linear-gradient(135deg,#ffcc00,#ffd700);
  color:#000; font-size:16px; font-weight:800; letter-spacing:.4px;
  cursor:pointer; box-shadow:0 6px 18px rgba(255,204,0,.25);
  margin-top:6px;
}
.wk-start:active{ transform:scale(.98); }

/* ================= ЭКРАН ТАЙМЕРА ================= */
.run{
  position:fixed; inset:0; z-index:900;
  display:none; flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
  color:var(--ink);
  transition:background .5s ease;
  overflow:hidden;
}
.run.show{ display:flex; }
.run.prep{ background:linear-gradient(180deg,#3d5158 0%,#4b6068 55%,#3a4d54 100%); }
.run.work{ background:linear-gradient(180deg,#6d1414 0%,#942b2b 55%,#681212 100%); }
.run.rest{ background:linear-gradient(180deg,#0e4829 0%,#1d6b41 55%,#0c3f25 100%); }

.topbar{
  display:flex; justify-content:space-between; align-items:flex-start;
  flex:0 0 auto;
}
.tb-label{ font-size:12px; opacity:.6; margin-bottom:3px; letter-spacing:.3px; }
.tb-value{
  font-size:27px; font-weight:700; letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
}
.tb-right{ text-align:right; }

.mid{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.bigclock{
  font-size:clamp(66px,23vw,116px);
  font-weight:800; line-height:1; letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 6px 30px rgba(0,0,0,.28);
}
.phase{
  font-size:clamp(19px,5.6vw,25px);
  font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; margin-top:14px; opacity:.94;
}
.run.work .phase{ animation:wkPulse 1.8s ease-in-out infinite; }
@keyframes wkPulse{
  0%,100%{ opacity:.94; }
  50%{ opacity:.55; }
}

.exblock{
  display:none; flex-direction:column; align-items:center;
  margin-top:18px;
}
.exblock.show{ display:flex; }
.eximg{
  width:min(34vw,140px); height:min(34vw,140px);
  border-radius:18px; overflow:hidden;
  background:rgba(0,0,0,.25);
  display:flex; align-items:center; justify-content:center;
}
.eximg img{ width:100%; height:100%; object-fit:cover; display:block; }
.exname{
  margin-top:10px;
  font-size:clamp(15px,4.4vw,19px);
  font-weight:700; text-align:center;
}

.lap{
  margin-top:14px; background:none; border:none; padding:8px;
  color:rgba(255,255,255,.82); cursor:pointer;
}

.bottombar{
  display:flex; justify-content:space-between; align-items:center;
  flex:0 0 auto; padding:0 2px 10px;
}
.icon-btn{
  background:none; border:none; padding:8px; cursor:pointer;
  color:rgba(255,255,255,.85); display:flex;
}
.icon-btn.off{ color:rgba(255,255,255,.35); }

.controls{
  display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center; gap:20px; flex:0 0 auto;
  padding-bottom:2px;
}
.ctl{
  background:none; border:none; color:#fff;
  cursor:pointer; padding:12px;
  display:flex; justify-content:center;
}
.ctl:active{ opacity:.6; }

/* ================= ФИНИШ ================= */
.wk-finish{
  position:fixed; inset:0; z-index:950;
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center; padding:24px;
  background:linear-gradient(180deg,#0a0a12 0%,#1a1206 55%,#0a0a12 100%);
  color:#fff; overflow-y:auto;
}
.wk-finish.show{ display:flex; }
.wk-trophy{ font-size:72px; margin-bottom:8px; }
.wk-finish h2{ font-size:22px; margin:0 0 10px; }
.wk-fin-stats{
  font-size:13px; color:#8e8e93; line-height:1.7; margin-bottom:18px;
}
.wk-fin-xp{
  font-size:28px; font-weight:800; color:#ffcc00; margin-bottom:22px;
}
.wk-quote{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px; padding:18px;
  max-width:360px; margin-bottom:24px;
}
.wk-quote p:first-child{
  font-style:italic; font-size:16px; line-height:1.45; margin:0 0 10px;
}
.wk-quote p:last-child{
  text-align:right; font-weight:700; font-size:12px; color:#8e8e93; margin:0;
}
</style>
</head>
<body>

<!-- ================== НАСТРОЙКА ================== -->
<div id="setup" class="inner-screen">
<button class="back-btn" onclick="window.location.href='index.html'">← Назад в приложение</button>
<h1>Тренировка</h1>

<div class="tabs">
  <button id="tabCardio" class="tab" onclick="setTab('cardio')">Кардио</button>
  <button id="tabTimer" class="tab on" onclick="setTab('timer')">Таймер</button>
</div>

<div id="paneCardio" class="pane">
  <div class="empty">
    <div class="empty-icon">🏃</div>
    <div class="empty-title">Кардио</div>
    <div class="empty-text">Раздел пустой. Скажите, какое кардио нужно, и я сделаю.</div>
  </div>
</div>

<div id="paneTimer" class="pane on">
  <div class="wk-sec">
    <div class="wk-row">
      <span class="wk-label">Подходы</span>
      <div class="wk-stepper">
        <button onclick="bumpRounds(-1)">−</button>
        <span id="roundsVal">3</span>
        <button onclick="bumpRounds(1)">+</button>
      </div>
    </div>

    <div class="wk-row col">
      <span class="wk-label">Подготовка</span>
      <div class="wk-chips" id="prepChips"></div>
    </div>

    <div class="wk-row col">
      <span class="wk-label">Тренировка</span>
      <div class="wk-chips" id="workChips"></div>
    </div>

    <div class="wk-row col">
      <span class="wk-label">Отдых</span>
      <div class="wk-chips" id="restChips"></div>
    </div>

    <div class="wk-custom">
      <input id="c-min" type="number" min="0" placeholder="мин">
      <input id="c-sec" type="number" min="0" max="59" placeholder="сек">
      <select id="c-target">
        <option value="prep">Подготовка</option>
        <option value="work">Тренировка</option>
        <option value="rest">Отдых</option>
      </select>
      <button onclick="applyCustom()">✓</button>
    </div>

    <div class="wk-summary" id="summary"></div>
  </div>

  <button class="wk-start" onclick="startSession()">Начать тренировку</button>
</div>
</div>

<!-- ================== ТАЙМЕР ================== -->
<div id="run" class="run prep">
  <div class="topbar">
    <div>
      <div class="tb-label">Оставшееся время</div>
      <div class="tb-value" id="totalLeft">00:00</div>
    </div>
    <div class="tb-right">
      <div class="tb-label">Подходы</div>
      <div class="tb-value" id="setsVal">0/3</div>
    </div>
  </div>

  <div class="mid">
    <div class="bigclock" id="clock">00:05</div>
    <div class="phase" id="phaseLabel">Подготовка</div>

    <div class="exblock" id="exBlock">
      <div class="eximg" id="exImg"></div>
      <div class="exname" id="exName"></div>
    </div>

    <button class="lap" onclick="restartPhase()" aria-label="Начать заново">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.9-6.4"/>
        <path d="M20.5 3.6v5.2h-5.2"/>
      </svg>
    </button>
  </div>

  <div class="bottombar">
    <button class="icon-btn" id="lockBtn" onclick="toggleWake()" aria-label="Не гасить экран">
      <svg id="lockIcon" width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 7.6-1.7"/>
      </svg>
    </button>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()" aria-label="Звук">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
        <path id="wave" d="M15.5 8.4a5 5 0 0 1 0 7.2" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path id="slash" d="M16 9.5l4 5M20 9.5l-4 5" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none"/>
      </svg>
    </button>
  </div>

  <div class="controls">
    <button class="ctl" onclick="prevPhase()" aria-label="Назад">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
        <rect x="5" y="5.5" width="2.4" height="13" rx="1"/>
        <path d="M19 5.5v13l-9.6-6.5z"/>
      </svg>
    </button>
    <button class="ctl" id="pauseBtn" onclick="togglePause()" aria-label="Пауза">
      <svg id="pauseIcon" width="42" height="42" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6.5" y="4.5" width="4" height="15" rx="1.5"/>
        <rect x="13.5" y="4.5" width="4" height="15" rx="1.5"/>
      </svg>
    </button>
    <button class="ctl" onclick="nextPhase()" aria-label="Дальше">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
        <rect x="16.6" y="5.5" width="2.4" height="13" rx="1"/>
        <path d="M5 5.5v13l9.6-6.5z"/>
      </svg>
    </button>
  </div>
</div>

<!-- ================== ФИНИШ ================== -->
<div id="finish" class="wk-finish">
  <div class="wk-trophy">🏆</div>
  <h2>Тренировка завершена!</h2>
  <div class="wk-fin-stats" id="finStats"></div>
  <div class="wk-fin-xp" id="finXp"></div>
  <div class="wk-quote">
    <p id="qText"></p>
    <p id="qAuthor"></p>
  </div>
  <button class="wk-start" style="max-width:320px;" onclick="goBackToMain()">Принять</button>
</div>

<script src="quotes.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const sb = supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);

/* Упражнение для показа на таймере. null — только таймер.
   Пример: { name: 'Приседания', photo: 'ex-squat.jpg' } */
const EXERCISE = null;

const XP_PER_ROUND = 15;
const XP_BONUS = 20;

const PREP_OPTIONS = [3, 5, 10, 15];
const WORK_OPTIONS = [60, 120, 180, 300, 600, 900];
const REST_OPTIONS = [15, 30, 45, 60, 90, 120];

const cfg = {
  prep:   parseInt(localStorage.getItem('wkPrep'))   || 5,
  work:   parseInt(localStorage.getItem('wkWork'))   || 300,
  rest:   parseInt(localStorage.getItem('wkRest'))   || 60,
  rounds: parseInt(localStorage.getItem('wkRounds')) || 3
};

let phase = 'prep';
let round = 1;
let totalMs = 0;
let remainingMs = 0;
let endAt = 0;
let running = false;
let iv = null;
let xpEarned = 0;
let finished = false;
let lastBeep = -1;
let soundOn = localStorage.getItem('wkSound') !== 'off';
let wakeLock = null;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

/* ==================== ЗВУК ==================== */
let actx = null;

function ac(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}

function tone(freq, delay, dur, type, gain){
  const c = ac();
  if (!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.9, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

/* Гонг: старт тренировки */
function playBell(){
  if (!soundOn) return;
  const c = ac();
  if (!c) return;
  const t0 = c.currentTime;
  [
    { f: 1180, g: 1.0,  d: 2.6 },
    { f: 1770, g: 0.7,  d: 2.2 },
    { f: 2380, g: 0.5,  d: 1.8 },
    { f: 3150, g: 0.35, d: 1.3 }
  ].forEach(p => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(p.f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(p.g, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + p.d);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + p.d + 0.05);
  });
}

/* Начало отдыха: двойной низкий сигнал */
function playRest(){
  if (!soundOn) return;
  tone(520, 0,   0.3, 'square', 0.9);
  tone(390, 0.25, 0.42, 'square', 0.9);
}

/* Начало подготовки: один тон */
function playPrep(){
  if (!soundOn) return;
  tone(880, 0, 0.22, 'square', 0.85);
}

/* Последние 5 секунд отдыха: бип */
function playBeep(){
  if (!soundOn) return;
  tone(1040, 0, 0.13, 'square', 0.9);
}

/* Запасной звук победы, если mp3 не загрузился */
function playVictory(){
  if (!soundOn) return;
  tone(523, 0,    0.3,  'square', 0.9);
  tone(659, 0.14, 0.3,  'square', 0.9);
  tone(784, 0.28, 0.6,  'square', 1.0);
}

function vibrate(p){ if (navigator.vibrate) navigator.vibrate(p); }

/* ==================== НАСТРОЙКА ==================== */
function setTab(which){
  $('tabCardio').classList.toggle('on', which === 'cardio');
  $('tabTimer').classList.toggle('on', which === 'timer');
  $('paneCardio').classList.toggle('on', which === 'cardio');
  $('paneTimer').classList.toggle('on', which === 'timer');
}

function fmtSec(sec){
  if (sec >= 60) return Math.round(sec / 60) + ' мин';
  return sec + ' сек';
}

function chipsHtml(list, current, kind){
  return list.map(sec =>
    '<button class="wk-chip' + (current === sec ? ' on' : '') +
    '" onclick="pickTime(\'' + kind + '\',' + sec + ')">' + fmtSec(sec) + '</button>'
  ).join('');
}

function renderChips(){
  $('prepChips').innerHTML = chipsHtml(PREP_OPTIONS, cfg.prep, 'prep');
  $('workChips').innerHTML = chipsHtml(WORK_OPTIONS, cfg.work, 'work');
  $('restChips').innerHTML = chipsHtml(REST_OPTIONS, cfg.rest, 'rest');
}

function pickTime(kind, sec){
  cfg[kind] = sec;
  localStorage.setItem('wk' + kind.charAt(0).toUpperCase() + kind.slice(1), sec);
  renderChips();
  updateSummary();
}

function bumpRounds(d){
  cfg.rounds = Math.min(30, Math.max(1, cfg.rounds + d));
  localStorage.setItem('wkRounds', cfg.rounds);
  $('roundsVal').textContent = cfg.rounds;
  updateSummary();
}

function applyCustom(){
  const m = parseInt($('c-min').value) || 0;
  const s = parseInt($('c-sec').value) || 0;
  const sec = m * 60 + s;
  if (sec <= 0) { tg.showAlert('Укажите время больше нуля'); return; }
  pickTime($('c-target').value, sec);
  $('c-min').value = '';
  $('c-sec').value = '';
}

function word(n){
  if (n === 1) return 'подход';
  if (n < 5) return 'подхода';
  return 'подходов';
}

function updateSummary(){
  const total = cfg.prep + cfg.rounds * cfg.work + (cfg.rounds - 1) * cfg.rest;
  $('summary').innerHTML =
    cfg.rounds + ' ' + word(cfg.rounds) +
    ' · подготовка ' + fmtSec(cfg.prep) +
    '<br>тренировка ' + fmtSec(cfg.work) + ' · отдых ' + fmtSec(cfg.rest) +
    '<br>Всего ≈ ' + Math.round(total / 60) + ' мин';
}

/* ==================== XP ==================== */
async function addXP(delta){
  const tgId = localStorage.getItem('tgId');
  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (!tgId && !email) return false;
  try {
    let q = sb.from('user_links').select('id,xp');
    q = tgId ? q.eq('telegram_id', tgId) : q.eq('email', email);
    const { data, error } = await q.limit(1);
    if (error || !data || !data.length) return false;
    const { error: upErr } = await sb
      .from('user_links')
      .update({ xp: (data[0].xp || 0) + delta })
      .eq('id', data[0].id);
    return !upErr;
  } catch (e) { return false; }
}

function awardXP(delta){
  localStorage.setItem('cachedXP', parseInt(localStorage.getItem('cachedXP') || '0') + delta);
  addXP(delta);
}

/* ==================== ТАЙМЕР ==================== */
function renderExercise(){
  const b = $('exBlock');
  if (!EXERCISE){ b.classList.remove('show'); return; }
  b.classList.add('show');
  $('exName').textContent = EXERCISE.name;
  $('exImg').innerHTML = EXERCISE.photo
    ? '<img src="' + EXERCISE.photo + '" alt="" onerror="this.parentNode.innerHTML=\'\'">'
    : '';
}

function startSession(){
  ac();
  finished = false;
  xpEarned = 0;
  round = 1;
  $('setup').style.display = 'none';
  $('finish').classList.remove('show');
  $('run').classList.add('show');
  enterPhase(cfg.prep > 0 ? 'prep' : 'work');
}

function enterPhase(p){
  phase = p;
  const sec = p === 'prep' ? cfg.prep : (p === 'work' ? cfg.work : cfg.rest);
  totalMs = sec * 1000;
  remainingMs = totalMs;
  endAt = Date.now() + remainingMs;
  running = true;
  lastBeep = -1;

  const run = $('run');
  run.classList.remove('prep', 'work', 'rest');
  run.classList.add(p);

  $('phaseLabel').textContent =
    p === 'prep' ? 'Подготовка' : (p === 'work' ? 'Тренировка' : 'Отдых');

  setPauseIcon(false);
  renderExercise();

  if (p === 'prep') playPrep();
  if (p === 'work') playBell();
  if (p === 'rest') playRest();

  render();
  clearInterval(iv);
  iv = setInterval(tick, 100);
}

function tick(){
  if (!running) return;
  const left = endAt - Date.now();
  if (left <= 0){ remainingMs = 0; render(); phaseDone(); return; }
  remainingMs = left;

  if (phase === 'rest'){
    const s = Math.ceil(left / 1000);
    if (s <= 5 && s > 0 && s !== lastBeep){ lastBeep = s; playBeep(); }
  }
  render();
}

function render(){
  const s = Math.ceil(Math.max(0, remainingMs) / 1000);
  $('clock').textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  $('totalLeft').textContent = fmtTotal(totalLeftMs());
  $('setsVal').textContent = (phase === 'prep' ? 0 : round) + '/' + cfg.rounds;
}

function fmtTotal(ms){
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  if (h > 0) return pad(h) + ':' + pad(m) + ':' + pad(s);
  return pad(m) + ':' + pad(s);
}

function totalLeftMs(){
  const W = cfg.work * 1000;
  const R = cfg.rest * 1000;
  let ms = remainingMs;
  if (phase === 'prep'){
    ms += cfg.rounds * W + (cfg.rounds - 1) * R;
  } else if (phase === 'work'){
    const after = cfg.rounds - round;
    ms += after * W + after * R;
  } else {
    const after = cfg.rounds - round;
    ms += after * W + Math.max(0, after - 1) * R;
  }
  return ms;
}

function phaseDone(){
  clearInterval(iv);

  if (phase === 'prep'){ enterPhase('work'); return; }

  if (phase === 'work'){
    xpEarned += XP_PER_ROUND;
    awardXP(XP_PER_ROUND);
    vibrate([300, 120, 300]);
    if (round >= cfg.rounds){ finishSession(); return; }
    enterPhase('rest');
    return;
  }

  if (phase === 'rest'){
    round++;
    enterPhase('work');
  }
}

function setPauseIcon(paused){
  $('pauseIcon').innerHTML = paused
    ? '<path d="M8 5.2v13.6l11-6.8z"/>'
    : '<rect x="6.5" y="4.5" width="4" height="15" rx="1.5"/>' +
      '<rect x="13.5" y="4.5" width="4" height="15" rx="1.5"/>';
}

function togglePause(){
  if (finished) return;
  if (!running){
    endAt = Date.now() + remainingMs;
    running = true;
    setPauseIcon(false);
    clearInterval(iv);
    iv = setInterval(tick, 100);
    return;
  }
  remainingMs = Math.max(0, endAt - Date.now());
  running = false;
  clearInterval(iv);
  setPauseIcon(true);
  render();
}

function restartPhase(){
  if (finished) return;
  clearInterval(iv);
  enterPhase(phase);
}

/* вперёд, без начисления XP за раунд */
function nextPhase(){
  if (finished) return;
  clearInterval(iv);

  if (phase === 'prep'){ enterPhase('work'); return; }

  if (phase === 'work'){
    if (round >= cfg.rounds){ finishSession(); return; }
    enterPhase('rest');
    return;
  }

  round++;
  enterPhase('work');
}

/* назад */
function prevPhase(){
  if (finished) return;
  clearInterval(iv);

  if (phase === 'prep'){ enterPhase('prep'); return; }

  if (phase === 'work'){
    if (round === 1){ enterPhase('prep'); return; }
    round--;
    enterPhase('rest');
    return;
  }

  enterPhase('work');
}

function finishSession(){
  if (finished) return;
  finished = true;
  clearInterval(iv);
  running = false;

  xpEarned += XP_BONUS;
  awardXP(XP_BONUS);

  let played = false;
  const fallback = () => { if (!played){ played = true; playVictory(); } };
  try {
    const a = new Audio('12. Scroll Win 02.mp3');
    a.volume = 1;
    a.addEventListener('error', fallback);
    a.play().catch(fallback);
  } catch (e) { fallback(); }

  const total = cfg.prep + cfg.rounds * cfg.work + (cfg.rounds - 1) * cfg.rest;
  $('finStats').innerHTML =
    cfg.rounds + ' ' + word(cfg.rounds) + ' · ≈ ' + Math.round(total / 60) + ' мин';
  $('finXp').textContent = '+' + xpEarned + ' XP';

  let q = { text: 'Ты не проиграл, пока не остановился.', author: 'Майк Тайсон' };
  if (typeof allQuotes !== 'undefined' && allQuotes.length){
    q = allQuotes[Math.floor(Math.random() * allQuotes.length)];
  }
  $('qText').textContent = '«' + q.text + '»';
  $('qAuthor').textContent = '— ' + q.author;

  $('run').classList.remove('show');
  $('finish').classList.add('show');
}

/* ==================== ЭКРАН / ЗВУК ==================== */
async function toggleWake(){
  try {
    if (wakeLock){
      await wakeLock.release();
      wakeLock = null;
    } else if ('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; updateLockIcon(); });
    } else {
      tg.showAlert('Этот браузер не умеет не гасить экран.');
    }
  } catch (e){
    tg.showAlert('Не удалось включить. Экран может гаснуть.');
  }
  updateLockIcon();
}

function updateLockIcon(){
  $('lockBtn').classList.toggle('off', !wakeLock);
  $('lockIcon').innerHTML = wakeLock
    ? '<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>'
    : '<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 7.6-1.7"/>';
}

function toggleSound(){
  soundOn = !soundOn;
  localStorage.setItem('wkSound', soundOn ? 'on' : 'off');
  updateSoundIcon();
  if (soundOn) playPrep();
}

function updateSoundIcon(){
  $('soundBtn').classList.toggle('off', !soundOn);
  $('wave').style.display = soundOn ? '' : 'none';
  $('slash').style.display = soundOn ? 'none' : '';
}

function goBackToMain(){
  setTimeout(() => { window.location.href = 'index.html'; }, 100);
}

/* ==================== СТАРТ ==================== */
$('roundsVal').textContent = cfg.rounds;
renderChips();
updateSummary();
updateSoundIcon();
updateLockIcon();
</script>
