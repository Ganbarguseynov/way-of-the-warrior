<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренировка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
body { background: #0a0e27; }

#finish-view {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 100vh;
  padding: 24px;
  box-sizing: border-box;
}

.timer-section {
  background: linear-gradient(135deg, rgba(255, 204, 0, 0.08) 0%, rgba(90, 200, 250, 0.08) 100%);
  border: 1px solid rgba(255, 204, 0, 0.2);
  border-radius: 16px;
  padding: 24px;
  margin: 20px 0;
  box-sizing: border-box;
}

.timer-title {
  font-size: 16px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.timer-mode-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}

.mode-btn {
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  color: #8e8e93;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.mode-btn.active {
  background: linear-gradient(135deg, #ffcc00 0%, #ffd700 100%);
  color: #000;
  border-color: #ffcc00;
  box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
}

.presets-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.preset-btn {
  padding: 10px 8px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.preset-btn:active {
  background: rgba(255, 204, 0, 0.2);
  border-color: #ffcc00;
}

.custom-time {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-bottom: 20px;
}

.custom-time input {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  outline: none;
}

.custom-time input::placeholder { color: rgba(255, 255, 255, 0.4); }

.custom-time input:focus {
  border-color: #ffcc00;
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 8px rgba(255, 204, 0, 0.2);
}

.apply-btn {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #ffcc00 0%, #ffd700 100%);
  color: #000;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.apply-btn:active { transform: scale(0.95); }

.clock-display {
  font-size: 72px;
  font-weight: 300;
  text-align: center;
  color: #ffcc00;
  font-variant-numeric: tabular-nums;
  margin: 30px 0;
  letter-spacing: 4px;
  font-family: 'SF Mono', Monaco, 'Courier New', monospace;
}

.status-message {
  text-align: center;
  font-size: 12px;
  color: #8e8e93;
  margin-bottom: 20px;
  height: 18px;
}

.timer-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.timer-btn {
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.timer-btn.start {
  background: linear-gradient(135deg, #ffcc00 0%, #ffd700 100%);
  color: #000;
  box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
}

.timer-btn.start:active { transform: scale(0.95); }

.timer-btn.reset {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.action-btn {
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  width: 100%;
}

.set-complete {
  background: linear-gradient(135deg, #34c759 0%, #30b84f 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
}

.set-complete:active { transform: scale(0.98); }

.session-info {
  text-align: center;
  font-size: 12px;
  color: #8e8e93;
  margin: 10px 0 0 0;
}

.exercises { margin-bottom: 20px; }

.exercise-item {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 8px;
}

.exercise-item h4 {
  margin: 0 0 4px 0;
  font-size: 15px;
  color: #fff;
  font-weight: 600;
}

.exercise-item p { margin: 0; font-size: 12px; color: #8e8e93; }

.finish-trophy { font-size: 80px; margin-bottom: 10px; }
.finish-title { font-size: 24px; color: #fff; margin: 0 0 8px 0; }
.finish-stats { color: #8e8e93; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

.quote-box {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 28px;
  max-width: 380px;
  box-sizing: border-box;
}

.finish-quote { font-style: italic; font-size: 17px; color: #fff; margin: 0 0 10px 0; line-height: 1.4; }
.finish-author { text-align: right; font-weight: 700; font-size: 13px; color: #8e8e93; margin: 0; }
</style>
</head>
<body>

<div id="workout-view" class="inner-screen">
<button class="back-btn" onclick="window.location.href='index.html'">← Назад в приложение</button>
<h1>Тренировка</h1>

<div class="exercises">
<div class="exercise-item"><h4>Приседания</h4><p>3 подхода • 15 повторений</p></div>
<div class="exercise-item"><h4>Отжимания</h4><p>3 подхода • 10 повторений</p></div>
</div>

<div class="timer-section">
<div class="timer-title">Настройка таймера</div>

<div class="timer-mode-switch">
<button class="mode-btn active" id="mode-work" onclick="setMode('work')">Тренировка</button>
<button class="mode-btn" id="mode-rest" onclick="setMode('rest')">Отдых</button>
</div>

<div class="presets-row" id="presets"></div>

<div class="custom-time">
<input type="number" id="custom-min" min="0" placeholder="мин">
<input type="number" id="custom-sec" min="0" max="59" placeholder="сек">
<button class="apply-btn" onclick="applyCustom()">Задать</button>
</div>

<div class="clock-display" id="clock">10:00</div>

<div class="status-message" id="status"></div>

<div class="timer-buttons">
<button class="timer-btn start" id="start-btn" onclick="toggle()">Старт</button>
<button class="timer-btn reset" onclick="reset()">Сброс</button>
</div>
</div>

<button class="action-btn set-complete" onclick="completeSet()">Подход выполнен (+15 XP)</button>
<p class="session-info" id="session-info"></p>
</div>

<div id="finish-view">
<div class="finish-trophy">🏆</div>
<h2 class="finish-title">Тренировка завершена!</h2>
<p class="finish-stats" id="finish-stats"></p>
<div class="quote-box">
<p class="finish-quote" id="finish-quote"></p>
<p class="finish-author" id="finish-author"></p>
</div>
<button class="action-btn start" onclick="goBackToMain()">Принять</button>
</div>

<script src="quotes.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const sb = supabase.createClient('https://qnpriwfxzuoymoumdtrl.supabase.co', 'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF');

const BONUS_XP = 20;
const PRESETS = { work: [300, 600, 900, 1800, 2700], rest: [30, 45, 60, 90, 120] };
const saved = {
  work: parseInt(localStorage.getItem('wkWork')) || 600,
  rest: parseInt(localStorage.getItem('wkRest')) || 45
};

let mode = 'work';
let total = saved.work * 1000;
let remaining = total;
let endAt = 0;
let running = false;
let iv = null;
let sets = 0;
let finished = false;

const $ = id => document.getElementById(id);

function pad(n){ return String(n).padStart(2, '0'); }

function show(ms){
  const s = Math.ceil(Math.max(0, ms) / 1000);
  $('clock').textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
}

function setBtn(txt){ $('start-btn').textContent = txt; }

function stopTimer(){
  clearInterval(iv);
  running = false;
  setBtn('Старт');
}

function renderPresets(){
  $('presets').innerHTML = PRESETS[mode].map(sec =>
    '<button class="preset-btn" onclick="setPreset(' + sec + ')">' +
    (sec >= 60 ? Math.round(sec / 60) + ' мин' : sec + ' сек') +
    '</button>'
  ).join('');
}

function setMode(m){
  if (running || finished) return;
  mode = m;
  $('mode-work').classList.toggle('active', m === 'work');
  $('mode-rest').classList.toggle('active', m === 'rest');
  total = saved[m] * 1000;
  remaining = total;
  $('status').textContent = '';
  renderPresets();
  show(remaining);
}

function setPreset(sec){
  if (running || finished) return;
  saved[mode] = sec;
  localStorage.setItem(mode === 'rest' ? 'wkRest' : 'wkWork', sec);
  total = sec * 1000;
  remaining = total;
  $('status').textContent = '';
  show(remaining);
}

function applyCustom(){
  if (running || finished) return;
  const m = parseInt($('custom-min').value) || 0;
  const s = parseInt($('custom-sec').value) || 0;
  const sec = m * 60 + s;
  if (sec <= 0) { $('status').textContent = 'Укажите время больше нуля'; return; }
  setPreset(sec);
}

function toggle(){
  if (finished) return;
  if (running) {
    remaining = Math.max(0, endAt - Date.now());
    stopTimer();
    show(remaining);
    return;
  }
  if (remaining <= 0) remaining = total;
  endAt = Date.now() + remaining;
  running = true;
  setBtn('Пауза');
  $('status').textContent = '';
  iv = setInterval(tick, 250);
}

function tick(){
  const left = endAt - Date.now();
  if (left <= 0) {
    stopTimer();
    remaining = 0;
    show(0);
    if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
    if (mode === 'work') autoFinish();
    else tg.showAlert('Отдых окончен!');
    return;
  }
  remaining = left;
  show(left);
}

function reset(){
  if (finished) return;
  stopTimer();
  remaining = total;
  $('status').textContent = '';
  show(remaining);
}

async function addXP(delta){
  const tgId = localStorage.getItem('tgId');
  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (!tgId && !email) return false;
  let q = sb.from('user_links').select('id,xp');
  q = tgId ? q.eq('telegram_id', tgId) : q.eq('email', email);
  const { data, error } = await q.limit(1);
  if (error || !data || !data.length) return false;
  const { error: upErr } = await sb.from('user_links')
    .update({ xp: (data[0].xp || 0) + delta }).eq('id', data[0].id);
  return !upErr;
}

async function completeSet(){
  if (finished) return;
  sets++;
  localStorage.setItem('cachedXP', parseInt(localStorage.getItem('cachedXP') || '0') + 15);
  $('session-info').textContent = 'Подходов за сессию: ' + sets;
  try {
    const ok = await addXP(15);
    tg.showAlert(ok ? '+15 XP добавлено!' : '+15 XP на телефоне. В аккаунт не записалось, проверьте вход.');
  } catch (e) {
    tg.showAlert('+15 XP на телефоне. Ошибка сети.');
  }
}

async function autoFinish(){
  finished = true;
  setBtn('Старт');

  const winAudio = new Audio('12. Scroll Win 02.mp3');
  winAudio.play().catch(() => {});

  let ok = false;
  try { ok = await addXP(BONUS_XP); } catch (e) { ok = false; }
  if (ok) localStorage.setItem('cachedXP', parseInt(localStorage.getItem('cachedXP') || '0') + BONUS_XP);

  const kcal = sets * 15;
  $('finish-stats').textContent =
    'Подходов: ' + sets + ' · Сожжено: ' + kcal + ' ккал' +
    (ok ? ' · +' + BONUS_XP + ' XP за завершение' : ' · XP не записался в аккаунт');

  let q = { text: 'Ты не проиграл, пока не остановился.', author: 'Майк Тайсон' };
  if (typeof allQuotes !== 'undefined' && allQuotes.length) {
    q = allQuotes[Math.floor(Math.random() * allQuotes.length)];
  }
  $('finish-quote').textContent = '«' + q.text + '»';
  $('finish-author').textContent = '— ' + q.author;

  $('workout-view').style.display = 'none';
  $('finish-view').style.display = 'flex';
}

function goBackToMain(){
  setTimeout(() => { window.location.href = 'index.html'; }, 100);
}

setMode('work');
</script>
</body>
</html>
